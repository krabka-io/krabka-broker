# The self-check of the sustained-load contract, with the slow follower slowed
# by `tc netem` instead of a CPU quota.
#
# The 72-hour contract slows a follower with `netem`, and that fault had never
# run: no test kernel the repository used had `sch_netem` (release blocker B7).
# This is `self-check.yaml` with that one fault changed, so a pass shows the
# executor can add the qdisc in a broker's network namespace, that the cluster
# rides out 200 ms of added latency on a follower, and that the qdisc is
# removed again, before the 72-hour run depends on it. It runs in the nightly
# `netem` job of `ci.yml`, which loads `sch_netem` on a GitHub-hosted runner
# first and fails if it cannot. The pull-request container matrix keeps
# `self-check.yaml`, because its remote executors may lack the module.
name: self-check-netem
profile: self_check
seed: 1392
duration: 270s
settle: 40s

host:
  cpus: 4
  memory: 16GiB
  disk_capacity: 2GiB
  disk_reserve: 4GiB

cluster:
  brokers: 3
  replication_factor: 3
  min_insync_replicas: 2
  # The cluster's `controller_fetch_timeout`, Kafka's
  # `controller.quorum.fetch.timeout.ms`: the follower fetch watchdog after
  # which a silent controller leader is replaced. The executor configures every
  # node with this value, so the pause plans are checked against the timeout
  # the cluster runs with, not the broker's 2 s default.
  check_quorum_window: 5s
  replica_lag_time_max: 30s

clients:
  producer:
    acks: all
    compression: lz4
    linger: 5ms
    batch_size: 16KiB
    request_timeout: 10s
    delivery_timeout: 30s
    max_send_attempts: 3
  transactions:
    timeout: 30s
    records_per_transaction: 10
    abort_every: 4
  consumer:
    session_timeout: 10s
    commit_interval: 2s
    poll_timeout: 200ms

paths:
  - name: classic-idempotent
    semantics: idempotent
    storage: classic
    partitions: 3
    rate: 40/s
    throughput_floor: 20/s
    payload: 512B
    consumers: [read_uncommitted, read_committed]
    commit_offsets: true
    produce_latency: {p50: 500ms, p99: 5s, p999: 10s}
    consume_latency: {p50: 2s, p99: 10s, p999: 20s}
  - name: classic-transactional
    semantics: transactional
    storage: classic
    partitions: 3
    rate: 40/s
    throughput_floor: 20/s
    payload: 512B
    consumers: [read_committed, read_uncommitted]
    commit_offsets: true
    produce_latency: {p50: 500ms, p99: 5s, p999: 10s}
    consume_latency: {p50: 2s, p99: 10s, p999: 20s}
  - name: classic-compacted
    semantics: compacted
    storage: classic
    partitions: 3
    rate: 40/s
    throughput_floor: 20/s
    payload: 256B
    key_space: 64
    consumers: [read_uncommitted]
    produce_latency: {p50: 500ms, p99: 5s, p999: 10s}
    consume_latency: {p50: 2s, p99: 10s, p999: 20s}

# Each deadline is at least twice the worst recovery measured locally against
# the packaged broker: a graceful follower restart fails over in up to 10s and
# rejoins the ISR in up to 11s, and a two-second pause catches up in well under
# a second. No fault of this contract is measured for a controller failover.
deadlines:
  leader_failover: 25s
  isr_rejoin: 30s
  controller_failover: 20s
  catch_up_after_pause: 20s

faults:
  - name: quiet-pause
    fault: {kind: pause}
    target: follower
    first_at: 20s
    duration: 2s
  - name: slow-follower
    fault:
      kind: slow_follower
      slowdown:
        method: netem
        delay: 200ms
        jitter: 50ms
        image: nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    target: follower
    first_at: 45s
    duration: 15s
  - name: disk-pressure
    fault: {kind: disk_pressure, watermark: 25%}
    target: follower
    first_at: 95s
    duration: 10s
  # Held past the broker's 9s `heartbeat_timeout`, so the broker is fenced
  # and rejoins as a new incarnation whatever its controlled shutdown did.
  - name: follower-restart
    fault: {kind: restart, graceful: true}
    target: follower
    first_at: 140s
    duration: 15s

self_check:
  missing_record_path: classic-idempotent
  missed_deadline: {fault: follower-restart, check: isr_rejoin, deadline: 1ms}
