# cargo-mutants configuration — https://mutants.rs
#
# Read by a local `cargo mutants` run. NOT read by the `cargo_mutants_test`
# targets: `rules_rs_mutants` enumerates mutants by copying the crate's sources
# into a synthetic single-crate workspace under a temp dir and running
# `cargo mutants --list` there, and this file is not among the sources it
# copies. So under Bazel every setting below is inert -- the exclusions do not
# exclude, and `timeout_multiplier`/`minimum_test_timeout` are replaced by the
# rule's own `timeout_multiplier` attribute and the runner's 20s floor.
#
# That matters most for the excludes: `crates/broker/src/bin/**` is swept under
# Bazel despite this file, and mutants that cannot be killed by any test --
# `throttle::capped` is `#[cfg(creusot)]`, so a normal build does not compile it
# -- have no way to be marked. Making the sweep honour this file needs the
# aspect to pass the config through to `mutants_list`, which is a patch to
# rules_rs_mutants.

test_tool = "nextest"
profile = "mutants"

# A surviving mutant deep in the broker / log / raft paths is often only caught
# by the slower in-process suites under each crate's tests/ dir. Give every
# mutant a generous timeout relative to the unmutated baseline so a
# legitimately-slower-but-correct run is not misreported as a timeout survivor.
timeout_multiplier = 5.0
minimum_test_timeout = 120

exclude_globs = [
    # `crabka-broker`'s `main` is pure entrypoint glue: parse CLI args, derive
    # the controller listener and self single-voter set, build `BrokerConfig`,
    # hand it to `Broker::start`, then wait for a termination signal and
    # controlled-shutdown. No unit-testable signal -- no test constructs the
    # live broker from CLI args -- and it is exercised end to end by
    # `tests/cli_smoke.rs`, which boots the real binary. A file glob rather than
    # an `exclude_re` because name-regex exclusions do not reliably match
    # struct-field-deletion mutants here.
    "crates/broker/src/bin/**",
    # crabka-audit's `verify` CLI: clap arg-parse plus VerifyReport->ExitCode
    # glue. The verification logic lives in verify.rs and IS mutation-tested.
    "crates/audit/src/bin/**",
]

exclude_re = [
    # Removing the client-metrics shutdown call leaves the live OTLP worker
    # waiting forever. The drain test detects that, but cargo-mutants can only
    # classify the deliberately stuck process as a timeout.
    "broker/src/client_metrics/mod\\.rs.*replace ClientMetrics::shutdown with \\(\\)",
    # `capped` is `#[cfg(creusot)] #[logic]`: a specification function that a
    # normal build does not compile, so mutating it changes nothing that runs
    # and no test can tell. Creusot discharges it instead, under verif/.
    # Matched on path and function rather than on the mutation's wording: a
    # whole-function mutant reads "replace capped Int with ..." (the return type
    # is in there) and an operator one reads "replace + with * in capped", so
    # anything tighter matches one genre and silently misses the other.
    "throttle/src/lib\\.rs.*capped",
    # `base64_encode` packs three bytes into one u32 as
    # `(b0 << 16) | (b1 << 8) | b2`. The shifts put each byte in its own eight
    # bits, so no two operands share a set bit and `|` and `^` agree on every
    # input. Equivalent mutants, not a gap: the encoder is covered.
    "replace \\| with \\^ in base64_encode",
    # `crates/verified` carries its Creusot specification beside the executable
    # code. These are `#[cfg(creusot)] #[logic]` functions and the `lemma_*`
    # proof obligations: a normal build does not compile them, so mutating one
    # changes nothing that runs and no test can tell. Creusot discharges them,
    # under verif/.
    "verified/src/(consensus|compaction)\\.rs.*(hwm_member_at|count_ge|least_hwm_member_ge_index|lemma_|compute_horizon_model)",
    # The rest of `verified`'s survivors are equivalent mutants: a comparison
    # whose two branches yield the same value at the boundary the mutation
    # moves. Left as they are rather than rewritten -- these bodies carry
    # Creusot contracts, and a refactor invalidates a proof session that cannot
    # be re-discharged here.
    #
    # `if lso < hw { lso } else { hw }` -- at equality both arms are the same.
    "replace < with <= in fetch_visibility",
    # `spso > log_start` picking the larger, and `difference > 0` clamping at
    # zero: at equality each yields the value the other branch would.
    "replace > with >= in effective_share_backlog",
    # `count < majority` only saturates the tally; the answer is
    # `count >= majority`, which one extra increment does not move.
    "replace < with <= in candidate_has_majority",
    # `cand > majority_offset` guards an assignment of `cand`; at equality it
    # assigns the value already there.
    "replace > with >= in recompute_high_watermark",
    # `(byte & !COMPRESSION_MASK) | code` with codes 0..=3 and a 0x07 mask: the
    # mask clears exactly the bits the code sets, so `|` and `^` compute the
    # same function. An equivalent mutant, not a gap.
    "replace \\| with \\^ in attrs_with_compression",
]
