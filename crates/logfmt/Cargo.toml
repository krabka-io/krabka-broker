[package]
name = "krabka-logfmt"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Structured-JSON (Cloud Logging-friendly) tracing log formatter shared across Krabka services"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-logfmt"
readme = "README.md"
keywords = ["kafka", "logging", "tracing", "json", "krabka"]
categories = ["development-tools::debugging"]

[lints]
workspace = true

[dependencies]
assert2 = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
bon = { workspace = true }
# No `version`: `krabka-bdd` is not published, so cargo drops it from the
# published manifest. See CLAUDE.md "Releases".
krabka-bdd = { path = "../bdd" }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
# Parses the RFC 3339 timestamp the scenarios read back.
time = { workspace = true, features = ["parsing"] }
yare = { workspace = true }
