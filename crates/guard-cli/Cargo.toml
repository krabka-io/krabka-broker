[package]
name = "krabka-guard"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Administers krabka topic write freezes and break-glass proposals: freeze a scope, thaw one, and run the two-person rule"

[lints]
workspace = true

# A library as well as a binary, for the same reason `krabka-barrier` and
# `krabka-format` are: a test that spawns the binary needs a Cargo working tree
# to build it from, and a Bazel test sandbox has none. Tests call
# `run_from_args` in process instead.
[lib]
name = "krabka_guard"
path = "src/lib.rs"

[[bin]]
name = "krabka-guard"
path = "src/main.rs"

[dependencies]
# `FileEd25519Signer` is the signer the audit checkpoints already use. The
# operator key trust set and signer share one crypto owner here.
krabka-audit = { workspace = true }
# `--bootstrap-server` and `--command-config`, shared with every operator CLI.
krabka-cli-connection = { path = "../cli-connection" }
krabka-client-core = { version = "0.8.0" }
# `epoch_ms`, the epoch-millisecond clock a signed freeze record carries.
krabka-log = { version = "1.1.5", path = "../log" }
krabka-protocol = { version = "0.8.0" }
krabka-units = { workspace = true }

clap = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
# `cli_main!` writes the binary's `main`.
krabka-macros = { version = "1.1.5", path = "../macros" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
# The scenario driver's `boot` builder.
bon = { workspace = true }
# No `version`: `krabka-bdd` is not published. The Gherkin scenarios under
# `tests/features` bind through its `scenarios!`.
krabka-bdd = { path = "../bdd" }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
rust-embed = { workspace = true }
# Broker integration fixtures and value checks stay out of the production graph.
krabka-broker = { version = "1.1.5", path = "../broker", features = ["test-helpers"] }
krabka-security = { version = "0.8.0" }
# Signing goes through `FileEd25519Signer`, so `ring` is here only to mint the
# PKCS#8 key pair that a signature case hands to `--sign-with`.
ring = { workspace = true }
tempfile = { workspace = true }
yare = { workspace = true }
