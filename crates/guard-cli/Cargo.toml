[package]
name = "krabka-guard"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Administers krabka topic write freezes and break-glass proposals: freeze a scope, thaw one, and run the two-person rule"

[lints]
workspace = true

# A library as well as a binary, for the same reason `krabka-barrier` and
# `krabka-format` are: a test that spawns the binary needs a Cargo working tree
# to build it from, and a Bazel test sandbox has none. Tests call
# `run_from_args` in process instead.
[lib]
name = "krabka_guard"
path = "src/lib.rs"

[[bin]]
name = "krabka-guard"
path = "src/main.rs"

[dependencies]
# `FileEd25519Signer` is the signer the audit checkpoints already use. The
# operator key trust set and signer share one crypto owner here.
krabka-audit = { workspace = true }
krabka-client-core = { version = "0.7.1" }
krabka-protocol = { version = "0.7.0" }
krabka-units = { workspace = true }

clap = { workspace = true, features = ["env"] }
hex = { workspace = true }
serde = { workspace = true }
# `cli_main!` writes the binary's `main`.
krabka-macros = { version = "1.0.8", path = "../macros" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
# Broker integration fixtures and value checks stay out of the production graph.
krabka-broker = { version = "1.0.8", path = "../broker", features = ["test-helpers"] }
krabka-security = { version = "0.7.0" }
# Signing goes through `FileEd25519Signer`, so `ring` is here only to mint the
# PKCS#8 key pair that a signature case hands to `--sign-with`.
ring = { workspace = true }
tempfile = { workspace = true }
yare = { workspace = true }
