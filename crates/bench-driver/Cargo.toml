[package]
name = "krabka-bench-driver"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Load driver and report aggregator for the Krabka vs Strimzi benchmark harness"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-bench-driver"
readme = "README.md"
keywords = ["kafka", "benchmark", "load-test", "krabka"]
categories = ["development-tools::profiling"]

[lints]
workspace = true

# The in-cluster Job runs this one. `bench/manifests/driver/job-template.yaml`
# names it as the container command.
[[bin]]
name = "krabka-bench-driver"
path = "src/main.rs"

# The aggregator. It reads the per-run JSON the driver wrote and renders the
# summary, the CSVs and the HTML report.
[[bin]]
name = "krabka-bench-report"
path = "src/report_main.rs"

# The sustained-load judge. It validates a contract under `bench/soak/`, prints
# its fault schedule, and judges a run's evidence; `self-check` proves the
# judge catches an injected missing record and a missed recovery deadline.
[[bin]]
name = "krabka-soak-check"
path = "src/soak_check_main.rs"

# The executor of a disaster-recovery contract. The qualification drill runs
# its load against the secured source cluster until the loss, and its
# read-back against the cluster restored from the capture.
[[bin]]
name = "krabka-soak-drill"
path = "src/soak_drill_main.rs"

[dependencies]
bon = { workspace = true }
assert2 = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["env"] }
krabka-client-admin = { version = "0.6.0" }
krabka-client-consumer = { version = "0.6.0" }
krabka-client-core = { version = "0.6.0" }
krabka-client-producer = { version = "0.6.0" }
krabka-protocol = { version = "0.6.0", default-features = false }
krabka-security = { workspace = true }
krabka-units = { workspace = true }
krabka-macros = { version = "1.0.6", path = "../macros" }
derive_more = { workspace = true }
exponential-backoff = "2.1.1"
futures = "0.3"
hdrhistogram = { version = "7.6", default-features = false }
# The failover scenario deletes a broker Pod and watches the cluster recover,
# so the driver talks to the Kubernetes API directly.
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
num-traits = { workspace = true }
# HTML/Plotly.js graph rendering for the benchmark report. Default features
# only. `kaleido` and static export pull a native browser binary this does not
# need: the report emits self-contained HTML that loads Plotly from the CDN.
# shortcut: pin the unused-config fix, return to crates.io when upstream releases it.
plotly = { version = "0.14", git = "https://github.com/krabka-io/plotly.rs", rev = "8cc4414e63f66d4a99ebdd73d0d5bb9befd99613", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
refined_type = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde-saphyr = "2.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
krabka-client-core = { version = "0.6.0", features = ["mock"] }
# Runs bench/scenarios/*.yaml as one test case per file, so a scenario that
# stops parsing names itself.
libtest-mimic = "0.8"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
yare = { workspace = true }

[[test]]
name = "scenario_files"
harness = false

[[test]]
name = "contract_files"
harness = false
