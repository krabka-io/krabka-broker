[package]
name = "krabka-object-store"
# Internal plumbing (shared object-store construction); not part of the curated
# public crate surface — see the allowlist in tools/check-publish-allowlist.sh.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified object-store construction (typed config -> object_store handle) shared by Krabka's KIP-405 tiered storage and observability blockstore"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-object-store"
readme = "README.md"
keywords = ["kafka", "object-store", "s3", "gcs", "krabka"]
categories = ["database-implementations", "filesystem"]

[lints]
workspace = true

[dependencies]
object_store = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
http = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
mockall = { workspace = true }
