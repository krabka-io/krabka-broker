[package]
name = "krabka-restore"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Offline point-in-time restore: rebuilds a bootable krabka log directory from a KIP-405 tiered-storage archive"

[lints]
workspace = true

[lib]
name = "krabka_restore"
path = "src/lib.rs"

# `krabka-restore`, not `krabka-restore`. The `krabka` operator CLI resolves an
# unknown subcommand to `krabka-<name>` on `PATH`, the way git resolves
# `git foo` to `git-foo`. This exact spelling is what makes `krabka restore`
# work, so it deliberately breaks the `krabka-` convention the rest of the
# workspace follows.
[[bin]]
name = "krabka-restore"
path = "src/main.rs"

[dependencies]
maplit = { workspace = true }
# The target cluster is formatted through the same code path `krabka format`
# uses, with the recovered topic and partition records seeded into the
# bootstrap stream.
krabka-format = { version = "0.5.3", path = "../format" }
krabka-ids = { version = "0.4.0" }
krabka-log = { version = "0.5.3", path = "../log" }
krabka-metadata = { version = "0.4.0" }
# The archive handle is built straight onto the object-store layer. The broker
# owns the same mapping, but a recovery tool must not carry the broker.
krabka-object-store = { version = "0.5.3", path = "../object-store" }
krabka-protocol = { version = "0.4.0", default-features = false }
krabka-raft = { version = "0.5.3", path = "../raft" }
# The KIP-405 archive key codec and segment metadata model.
krabka-remote-storage = { version = "0.5.3", path = "../remote-storage" }
# `Snapshot::load` reads a broker's `remote-log-metadata/snapshot` for
# `--rlmm-snapshot`, the authoritative-metadata cross-check against the
# bucket scan.
krabka-remote-storage-topic = { version = "0.5.3", path = "../remote-storage-topic" }
krabka-verified = { version = "0.5.3", path = "../verified" }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
# The `.snapshot` sidecar's CRC32C header. `krabka-log` keeps its own decoder
# `pub(crate)`, so the archive-side verifier reimplements the documented
# format rather than reaching into the log crate's internals.
crc32c = { workspace = true }
object_store = { workspace = true }
# RE2 semantics: `--exclude-key` and `--exclude-header` run over millions of
# archived records, so an operator-supplied pattern must stay linear in the
# input. `java_regex` is for the KIP-664 `ListTransactions` wire surface and
# offers no such bound.
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-broker = { version = "0.5.3", path = "../broker", features = ["test-helpers"] }
krabka-client-core = { version = "0.4.0" }
krabka-security = { workspace = true }
tempfile = { workspace = true }
