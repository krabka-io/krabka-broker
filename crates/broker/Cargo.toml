[package]
name = "krabka-broker"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cluster-capable Apache Kafka-compatible krabka broker"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-broker"
readme = "README.md"
keywords = ["kafka", "broker", "streaming", "krabka"]
categories = ["database-implementations", "network-programming"]

[lints]
workspace = true

[features]
default = []
# Exposes test-only `BrokerHandle::test_truncate_local_log` /
# `test_advance_log_start` for the replication integration tests.
# Pulls in `krabka-log/test-helpers` to reach `Log::test_set_log_start_offset`.
test-helpers = ["krabka-log/test-helpers"]
# Expose jemalloc heap profiles on `/debug/pprof/heap`. Passes the flag
# through to krabka-telemetry (which gates the heap route) and activates the
# jemalloc global allocator in the broker binary. Unix-only at the dep level;
# the `#[global_allocator]` static is additionally guarded by `cfg(unix)`.
heap-profiling = ["krabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]


[[bin]]
name = "krabka-broker"
path = "src/bin/broker.rs"

[dependencies]
krabka-audit = { workspace = true }
krabka-protocol = { version = "0.4.0", default-features = false }
krabka-telemetry = { version = "0.4.0", path = "../telemetry" }
krabka-records-legacy = { version = "0.4.0", path = "../records-legacy" }
krabka-log = { version = "0.4.0", path = "../log" }
krabka-ids = { version = "0.4.0" }
krabka-compression = { version = "0.4.0", default-features = false }
krabka-raft = { version = "0.4.0", path = "../raft" }
krabka-kraft-core = { version = "0.4.0", path = "../kraft-core" }
krabka-verified = { version = "0.4.0", path = "../verified" }
krabka-voters = { version = "0.4.0" }
krabka-metadata = { version = "0.4.0" }
krabka-authz = { version = "0.4.0", path = "../authz" }
krabka-remote-storage = { version = "0.4.0", path = "../remote-storage" }
krabka-remote-storage-topic = { version = "0.4.0", path = "../remote-storage-topic" }
krabka-object-store = { version = "0.4.0", path = "../object-store" }
krabka-client-core = { version = "0.4.0" }
krabka-throttle = { version = "0.4.0", path = "../throttle" }
krabka-units = { workspace = true }
krabka-security.workspace = true
# KFC-7 broker-side schema validation: the Confluent wire framing, the
# registry REST client, and the untyped body validators.
krabka-schema-serde = { version = "0.4.0", features = ["avro", "protobuf", "json"] }
qubit-clock = { workspace = true, features = ["tokio"] }
arc-swap.workspace = true
async-trait.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wincode = { workspace = true }
wincode = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "io-util", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tokio-metrics = { workspace = true }
toml = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
java_regex = { workspace = true }
refined_type = { workspace = true }
tracing = { workspace = true }
rustix = { workspace = true }
socket2 = "0.6"
tracing-subscriber = { workspace = true }
opentelemetry-proto = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true }
prometheus-client.workspace = true
axum.workspace = true
# Fetch the OAUTHBEARER JWKS over HTTP(S). The `rustls` feature reuses the
# rustls + aws-lc-rs crypto stack already in the workspace dep graph.
# `json` (Response::json) + `form` (RequestBuilder::form) are for the
# RFC 7662 introspection POST; direct `serde_json` dep for the response value.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde_json = { workspace = true }
# Compile customClaimCheck JsonPath expressions at config-load
# and inject into the OAUTHBEARER validators.
jsonpath-rust = { workspace = true }
# KIP-48: base64-encode delegation-token HMAC bytes when
# synthesizing a SCRAM credential for token authentication
# (`network::auth::synthesize_token_scram_credential`).
base64.workspace = true
# Bounded decision cache for the OPA authorizer.
lru.workspace = true
num-traits.workspace = true
# Zero-copy: cast remote-tier OffsetIndex/TimeIndex byte buffers
# to typed entry slices instead of per-entry from_be_bytes() in a hot path.
zerocopy.workspace = true
# JSON Schema generation for FileConfig — consumed by crabka-docgen.
schemars = { workspace = true }
# KIP-714: stable subscription-id via CRC32C over sorted metric-prefix set.
crc32c = { workspace = true }
# KIP-714: decode OTLP MetricsData protobuf payloads in PushTelemetry handler.
prost = { workspace = true }
hex = { workspace = true }
# SHA-256 fingerprint of the configured break-glass approver set
# (`operator_keys::approver_set_fingerprint`), recorded on every break-glass
# audit event so a per-broker divergence in the set is visible afterwards.
sha2 = { workspace = true }
tonic = { workspace = true }
exponential-backoff = "2.1.0"

# Heap profiling via jemalloc. Unix-only: tikv-jemallocator does not build on
# Windows. The `heap-profiling` feature activates this dep; the global
# allocator static in broker.rs is additionally gated by `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

# Linux kTLS (Increment F): zero-copy `sendfile(2)` fetch over TLS connections.
# Linux-target-gated so macOS/Windows/BSD builds never compile (or resolve) it
# — the kTLS code paths are all `#[cfg(target_os = "linux")]`.
[target.'cfg(target_os = "linux")'.dependencies]
ktls = { workspace = true }
# Generate a throwaway self-signed cert for the one-shot startup kTLS probe
# (a loopback TLS handshake that exercises the real kernel TCP_ULP="tls" +
# crypto_info path). Linux-only, like the probe itself.
rcgen = { workspace = true }

# Cross-platform sendfile (Increment E): the BSD-family `sendfile(2)` wrapper for
# the zero-copy fetch path on Apple + FreeBSD/DragonFly. Linux uses `rustix`
# (already a direct dep); these targets use nix's SAFE `sys::sendfile::sendfile`
# (AsFd-based, no raw FFI) so it satisfies `unsafe_code = "forbid"`. The
# `zerocopy` feature gates the sendfile wrapper; 0.31 matches the version already
# in Cargo.lock. NOT pulled on Linux or Windows.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "freebsd", target_os = "dragonfly"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["zerocopy"] }

[dev-dependencies]
assert2 = { workspace = true }
# Trait mocks for the KIP-939 reaper orchestration unit tests
# (`txn::coordinator::ReaperBackend`).
mockall = { workspace = true }
mutants = { workspace = true }
stateright = { workspace = true }
# Large-N randomized fuzz of the idempotent-producer dedup core (`check_pure`),
# complementing the exhaustive stateright model (`producer_state_model.rs`).
proptest = { workspace = true }
krabka-broker = { path = ".", features = ["test-helpers"] }
# `bootstrap_consumption`, `cli_smoke` and `format_features` format a log
# directory before booting a broker. They call the library rather than spawn the
# binary: the formatting is setup, not the thing under test, and a subprocess
# would need a Cargo working tree, which a Bazel test sandbox does not have.
krabka-format = { version = "0.4.0", path = "../format" }
# Drives the relocated `client_admin_*` suites, which boot an in-process
# broker to exercise the admin client end to end.
krabka-client-admin = { version = "0.4" }
krabka-client-consumer = { version = "0.4" }
krabka-client-producer = { version = "0.4" }
# Host-side raw `Client::send(DescribeGroupsRequest)` against the
# real-Kafka Docker capture (`describe_groups_jvm.rs`).
krabka-client-core = { version = "0.4", features = ["mock"] }
krabka-ids = { version = "0.4.0" }
krabka-records-legacy = { version = "0.4.0", path = "../records-legacy" }
krabka-protocol = { version = "0.4", default-features = false }
# Serialize the captured real-Kafka DescribeGroups fixture as JSON.
serde_json = { workspace = true }
bytes = { workspace = true }
rustls.workspace = true
rustls-pki-types.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-rustls.workspace = true
# Client-side PBKDF2 of the SCRAM password to build
# `AlterUserScramCredentials` upsertions in tests.
pbkdf2 = { workspace = true }
# Metrics tests: exercise the axum Router::oneshot helper.
tower.workspace = true
# Mint ES256 tokens + build the matching JWK for the signed
# OAUTHBEARER wire test.
ring.workspace = true
# Generate a self-signed cert with 127.0.0.1 SAN on the
# fly for the HTTPS JWKS-refresher integration tests.
rcgen.workspace = true
# Scoped env-var mutation in tests for the delegation-token
# secret-key env-wins-over-TOML check. The workspace forbids `unsafe_code`,
# so direct `std::env::set_var` (unsafe under edition 2024) isn't available.
temp-env = "0.3"
# Mock OPA server for OpaAuthorizer unit tests — wiremock
# answers HTTP on a random local port and lets us assert call counts.
wiremock = "0.6"
