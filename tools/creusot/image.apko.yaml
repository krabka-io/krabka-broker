contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - apk-tools
    - autoconf
    - bash
    - build-base
    - busybox
    - ca-certificates-bundle
    - curl
    - git
    - gmp-dev
    - m4
    - mpfr-dev
    - ocaml
    - opam
    - pkgconf
    - python-3.13
    - rsync
    - rustup
    - unzip
    - wolfi-baselayout
    - zlib-dev

environment:
  HOME: /root
  PATH: /root/.cargo/bin:/root/.local/share/creusot/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  RUSTUP_TOOLCHAIN: nightly-2026-06-22

archs:
  - amd64
