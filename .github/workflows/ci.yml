name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the full container run.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      reference_sha:
        description: "Benchmark reference commit (defaults to the candidate's parent)"
        required: false
        type: string

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write

# Cancel superseded PR runs; let pushes to main run to completion. The event
# is part of the group so that a push to `main` never queues behind, or
# replaces the pending slot of, a scheduled or dispatched full run: a release
# needs one of those to finish green on its commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cpd:
    name: jscpd · zero repeats at 52 tokens
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - name: reject unimported crate-qualified Rust paths
        run: aspect check-imported-paths
      - name: reject Rust duplicates with jscpd
        run: aspect check-cpd --output "${RUNNER_TEMP}/cpd-reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpd
          path: ${{ runner.temp }}/cpd-reports
          if-no-files-found: warn

  # Format, lint, build, render rustdoc and gate the tests coverage cannot run.
  # Format and lint run here; the rest runs as one script in one Bazel output
  # tree, on a BuildBuddy remote runner when the run holds a key.
  #
  # Coverage is a sibling job rather than a step here. Both configurations build
  # the same ~140 broker integration tests as separate statically linked
  # binaries, and Bazel writes every one of them to `bazel-out` *and* to the
  # disk cache -- so running them on one runner put roughly 300 such binaries on
  # a 145 GB disk and filled it, which surfaced as a linker `Bus error` partway
  # through coverage. On two runners each configuration gets its own disk.
  #
  # `CI_BAZEL_SCRIPT` below runs every test target that needs no Docker daemon,
  # uninstrumented.
  # `coverage` runs most of the same targets again under instrumentation, but
  # only to measure. A target that fails under Bazel therefore fails here, in a
  # job whose log names it, and not only in the instrumented run.
  ci:
    name: build · lint · format · test · docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # Run as one bash script, on a BuildBuddy remote runner or on this runner
      # (see `.github/actions/buildbuddy-run`).
      CI_BAZEL_SCRIPT: |
        set -euo pipefail

        # One invocation builds `//...` and runs every test that needs no
        # Docker daemon and asserts on no wall clock, so test execution overlaps
        # the rest of the build instead of waiting for all of it. That covers
        # the rustdoc targets (none is `manual`), `//packaging:image_binaries_test`
        # and the Stateright models but `kraft_model_test`, which is
        # timing-sensitive and runs below. There are no test targets outside
        # `//crates` and `//packaging`.
        #
        # The test tag filter is named in full because `--test_tag_filters` is
        # last-wins: `-timing-sensitive` alone would drop the `-docker` that
        # `.bazelrc` sets for `test`. The remote cache holds test results, so a
        # change that leaves a target's inputs alone does not run it again.
        echo "::group::build and daemon-free tests"
        bazel test \
          --build_tag_filters=-docker \
          --test_tag_filters=-docker,-timing-sensitive \
          //...
        echo "::endgroup::"

        # The suites that assert on wall clock run in an invocation of their
        # own, after the build, so nothing competes with them for cores, and
        # never under `--config=rbe`: `cpu:4` means nothing to a remote
        # executor. //crates/raft records `kraft_engine_sim` failing 7 of 7 at
        # twelve concurrent runs and passing at six. The build tag filter
        # matches the invocation above so Bazel keeps its analysis cache.
        echo "::group::timing-sensitive tests"
        bazel test \
          --build_tag_filters=-docker \
          --test_tag_filters=timing-sensitive \
          //crates/...
        echo "::endgroup::"

        if [ -n "${BUILDBUDDY_ARTIFACTS_DIRECTORY:-}" ]; then
          (cd bazel-bin && find crates -name '*.rustdoc' -print0 \
            | tar --null -czf "${BUILDBUDDY_ARTIFACTS_DIRECTORY}/rustdoc.tar.gz" -T -)
        fi
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0

      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format

      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI.
      - name: lint
        run: aspect lint --bazel-flag=--config=rbe

      # The Bazel half of this job runs on a BuildBuddy remote runner when this
      # run holds a key; see `.github/actions/buildbuddy-run` for why. `format`
      # and `lint` stay here: they are short, `lint` already executes
      # remotely, and `aspect lint` annotates the pull request from here.
      - id: bazel
        name: build, test and docgen
        uses: ./.github/actions/buildbuddy-run
        with:
          lane: ci
          script: ${{ env.CI_BAZEL_SCRIPT }}
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bazel.outputs.remote != 'true'
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

  # Build and execute the tests with LLVM instrumentation, and upload the merged
  # LCOV report.
  #
  # `--build_tests_only` (set on the `coverage` command in `.bazelrc`) is what
  # keeps this to the tests it actually runs. `//crates/...` reaches the 22
  # `*_docker_test` wrappers, each of which links its suite a second time as a
  # `*_docker_bin`, and `--test_tag_filters` alone excludes a test from the run
  # but still builds it. Those 22 plus the timing-sensitive suites are
  # instrumented broker binaries this job would otherwise link and discard.
  #
  # This job used to carry `disk-cache: false`, alone among the Bazel jobs, and
  # the reason is worth keeping because it is what the remote cache fixes. The
  # disk cache was this job's largest consumer by a wide margin: on run
  # 33567157672 `~/.cache/bazel-disk` held 61 GB next to a 19 GB output tree and
  # the job ended with 33 GB free on a 145 GB disk. None of those writes had a
  # reader -- the `ci` job never looks up an instrumented action, and the key
  # hashes `MODULE.bazel` and every `BUILD.bazel`, so the next coverage run
  # asked for a different one. Nor did they stay on the runner: setup-aspect's
  # post step saves on a miss, so run 33569559769 saved a 22 GB instrumented
  # tree under the `ci` namespace that two other jobs then restored and could
  # not use. That is the growth #337 measured. Turning the cache off was the
  # only lever Bazel 9 offered, because `--noremote_upload_local_results` and
  # the `no-remote-cache` tags are defined against remote caches and leave
  # `--disk_cache` writable. The price was the third-party closure, compiled
  # rather than restored: about 17 minutes rather than about 7.5.
  #
  # A remote cache has neither problem. Instrumented actions key under their own
  # digests on the server, so they cost this runner no disk at all and cannot
  # collide with the uninstrumented namespace; there is nothing to evict, and
  # nothing to save on the way out. The `disk-cache` inputs are gone from every
  # job for the same reason -- they shared one 10 GB repository-wide GitHub
  # Actions quota across seven namespaces, which is why an "exact cache hit on
  # restore" still executed 2520 actions on run 33693850747's container jobs.
  # `bazelisk-cache` and `repository-cache` stay: they hold fetched archives
  # rather than build outputs, and they are small.
  #
  # Coverage only measures, and the `ci` job already runs the same targets
  # uninstrumented, so it sits out pull requests. A push to `main` always runs
  # it, for two reasons: Codecov's trend line for the default branch would
  # otherwise have holes, and `delivery` needs `[ci, coverage, supply-chain]`,
  # which a skipped `coverage` on `main` would never satisfy. A dispatch runs
  # it too.
  coverage:
    name: coverage
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      # No `fetch-depth: 0`: nothing here reads the merge base -- the report
      # covers every target under //crates/..., not the impacted ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # The instrumented build and run happen on a BuildBuddy remote runner
      # when this run holds a key (see `.github/actions/buildbuddy-run`), which
      # writes every result to the remote cache. `bb remote` has no documented
      # way to hand a file back, so the step after it runs the same command
      # here: every action is then a cache hit, and this runner downloads only
      # the per-test coverage files and merges them into the report Codecov
      # reads. Without a key the first step runs here and the second is a
      # no-op.
      - id: bazel
        name: coverage
        uses: ./.github/actions/buildbuddy-run
        with:
          lane: coverage
          script: bazel coverage //crates/...
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
      - name: collect the coverage report from the remote cache
        if: steps.bazel.outputs.remote == 'true'
        run: bazel coverage //crates/...

      - name: disk usage after coverage
        if: always()
        run: |
          df -h /
          du -sh ~/.cache/bazel ~/.cache/bazel-repo ~/.cache/bazel-disk 2>/dev/null || true

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Avoid the cli.codecov.io download endpoint's TLS handshake failures.
          use_pypi: true
          use_oidc: true
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: true

  supply-chain:
    name: cargo deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # The Cargo-side gate. `CONTRIBUTING.md`, `CLAUDE.md` and the pull request
  # template all ask for `cargo clippy --workspace --all-targets` and
  # `cargo nextest run --workspace` before a push; this is what makes those two
  # commands a merge gate rather than an honour system.
  #
  # It also checks the Cargo dependency graph, and covers targets omitted by
  # the impacted-target Bazel Clippy invocation:
  #
  #   * the benches under `crates/broker/benches` and `crates/log/benches`,
  #     including their Cargo-specific dependencies. Bazel also compiles and
  #     lints them through `crate_bench`;
  #   * the test and binary targets a change did not touch, which `aspect lint`
  #     narrows away on a pull request and `--all-targets` does not;
  #   * `krabka-protocol`'s build script, which `MODULE.bazel` pins with
  #     `gen_build_script = "off"` and which therefore only ever runs under
  #     Cargo.
  #
  # `cargo deny` is a sibling job rather than a step here for the same reason
  # it always was: it needs neither a toolchain nor a build directory.
  # Clippy gates every pull request that reaches the Rust build, because Bazel
  # does not run it. nextest repeats what the `ci` job's `bazel test` already
  # ran, under Cargo, so it runs on pushes to `main` and on a dispatch only.
  cargo:
    name: cargo clippy · nextest
    needs: select
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.select.outputs.rust == 'true')
    runs-on: ubuntu-26.04
    # Cold builds, the full suite and the post-job cache upload share this budget.
    timeout-minutes: 90
    # This job builds the whole workspace twice into one target directory --
    # `clippy --all-targets`, then nextest's own `cargo test --no-run
    # --workspace` -- and `[profile.dev]` carries full debug info. That
    # footprint reached the runner's disk: the lane died in the nextest step
    # with "No space left on device (os error 28)" out of rustc, then
    # "Free space left: 0 MB" from the runner itself, which is also why the
    # job's log could not be uploaded afterwards.
    #
    # `line-tables-only` keeps what a failing test needs -- a backtrace with
    # file and line -- and drops the type and variable descriptions that make
    # up the bulk of the bytes. It applies to this job only, so local builds
    # and every other lane keep full debug info, and it changes nothing about
    # which tests run or what they assert.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Clippy and nextest run on a BuildBuddy remote runner when this run
      # holds a key (see `.github/actions/buildbuddy-run`), whose snapshot keeps
      # the toolchain and the target directory warm between runs. Without one
      # they run here, where rustup installs the `rust-toolchain.toml` pin.
      #
      # `--all-targets` is also what keeps the criterion benches compiling: it
      # includes `--benches`, so every `[[bench]]` target in `crates/broker`
      # and `crates/log` is type-checked and a bench that stops building fails
      # here.
      #
      # `--profile ci` is what excludes the two suites `//crates/broker`'s
      # `manual` list excludes for the same reasons -- see the `default-filter`
      # in `.config/nextest.toml`. The container-backed cases are `#[ignore]`d
      # and nextest does not run those unless asked.
      - name: clippy and nextest
        uses: ./.github/actions/buildbuddy-run
        with:
          lane: cargo
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
          env: |
            CARGO_PROFILE_DEV_DEBUG=line-tables-only
            RUN_NEXTEST=${{ github.event_name != 'pull_request' }}
          script: |
            set -euo pipefail
            if ! command -v rustup >/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf --retry 5 https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
            fi
            export PATH="${CARGO_HOME:-${HOME}/.cargo}/bin:${PATH}"
            # Installs the channel and components `rust-toolchain.toml` names.
            rustup toolchain install

            cargo clippy --workspace --all-targets -- -D warnings

            if [ "${RUN_NEXTEST}" = "true" ]; then
              if ! command -v cargo-nextest >/dev/null; then
                curl -LsSf --retry 5 --retry-all-errors https://get.nexte.st/latest/linux \
                  | tar zxf - -C "${CARGO_HOME:-${HOME}/.cargo}/bin"
              fi
              cargo nextest run --workspace --profile ci
            fi
  # The broker library for wasm32-wasip1, the target that the Cluster Lab
  # runs a real broker on in a browser. Neither Bazel nor the job above builds
  # it, so this is what keeps the platform gates honest: a native-only
  # dependency or call that reaches the broker's library graph fails here.
  #
  # The C in zstd-sys, lzzzz and ring compiles with the runner's clang against
  # the WASI sysroot that wasi-sdk publishes, which is the only piece this job
  # downloads. `.cargo/config.toml` adds the `--cfg tokio_unstable` that tokio
  # needs for `net` on a wasm target, scoped to that target. The packages are
  # the broker's library and every workspace crate in its graph; the binaries
  # and the tests stay native-only.
  #
  # A pull request that does not reach the Rust build skips it.
  wasm:
    name: cargo clippy · wasm32-wasip1
    needs: select
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.select.outputs.rust == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-wasip1
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The runner ships clang, but its `llvm-ar` has a version suffix and no
      # unversioned name on PATH, so the archiver is resolved rather than
      # named.
      - name: install the WASI sysroot
        run: |
          set -euo pipefail
          curl -LsSf --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/wasi-sysroot.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sysroot-25.0.tar.gz
          tar zxf "${RUNNER_TEMP}/wasi-sysroot.tar.gz" -C "${RUNNER_TEMP}"
          ar="$(clang -print-prog-name=llvm-ar)"
          if ! command -v "${ar}" >/dev/null 2>&1; then
            ar="$(ls /usr/lib/llvm-*/bin/llvm-ar | sort -V | tail -n 1)"
          fi
          {
            echo "CC_wasm32_wasip1=clang"
            echo "AR_wasm32_wasip1=${ar}"
            echo "CFLAGS_wasm32_wasip1=--sysroot=${RUNNER_TEMP}/wasi-sysroot-25.0"
          } >> "${GITHUB_ENV}"

      - name: clippy
        run: >-
          cargo clippy --target wasm32-wasip1 --lib -p krabka-broker -p krabka-format -p krabka-raft -p krabka-log -p krabka-audit -p krabka-authz -p krabka-kraft-core -p krabka-logfmt -p krabka-object-store -p krabka-records-legacy -p krabka-remote-storage -p krabka-remote-storage-topic -p krabka-telemetry -p krabka-throttle -p krabka-verified -- -D warnings

  # The repository's cheap checks, in one job.
  #
  # These were four jobs -- `axl tasks`, `changelogs`, `creusot mutants::skip`
  # and `docs checks`. Every one of them wanted the same runner: a plain
  # checkout and the Aspect CLI, with no Bazel cache namespace and nothing to
  # build. Each then spent about 0.6 minutes on `setup-aspect` to do a few
  # seconds of work, and four of those slots came out of the 20-concurrent-job
  # cap that the container matrix is queued behind. Running the checks in
  # sequence here costs seconds and hands three slots back.
  #
  # None of them uses Bazel, so they still do not need the merge base or a
  # cache namespace: one `actions/checkout@v7` and one CLI is the union of what
  # the four asked for.
  checks:
    name: checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    # The longest of the four (`docs checks`, whose lychee step walks every
    # markdown file); the other three wanted 10.
    timeout-minutes: 45
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # Every check and generator this repository runs on a runner is an AXL task
      # under `.aspect/`, and this step is their unit tests. It is also where the
      # "check the check" steps that used to sit beside three of them now live:
      # `aspect axl-tests` runs every suite, so a check and its tests no longer have
      # to be invoked as a pair from the step that uses the check.
      - name: the tasks' own tests
        run: aspect axl-tests
      # `aspect check-scripts` is the ratchet beside them. A new `.sh` or `.py`
      # fails it unless a row in that task's allowlist says where the file runs and
      # why a task cannot go there.
      - name: no new shell or Python script
        run: aspect check-scripts

      # Krabka tags and releases the whole workspace as one unit, so the root
      # CHANGELOG.md is the only record of what shipped. The twelve crate
      # changelogs this repository inherited said otherwise: they documented
      # robot-head/crabka's releases under these crate names. This keeps a version
      # heading from coming back into one.
      - name: no crate changelog records a release
        run: aspect check-crate-changelogs

      # cargo-mutants generates mutants syntactically and does not evaluate
      # #[cfg], so every #[cfg(creusot)] fn in crates/verified/src/ is mutated
      # anyway and reported as a survivor unless its own definition carries
      # `#[cfg_attr(test, mutants::skip)]`. This keeps that pairing from silently
      # dropping off a function as crates/verified grows.
      - name: every #[cfg(creusot)] fn skips mutation testing
        run: aspect check-creusot-skip
      # The proved-package list and what the proof image actually proves cannot
      # drift apart. It runs here rather than in `proofs`, which a pull request
      # skips unless it touches the proved crates: a crate that gains a contract
      # is exactly the change that scope would not see.
      - name: the proofs job covers every Creusot package
        run: aspect check-creusot-packages

      # Documentation source checks do not use Bazel, so they stay off the
      # critical path while the `ci` job renders and uploads rustdoc from its
      # warm output tree.
      - name: generated KIP matrix
        run: |
          generated="$(mktemp)"
          trap 'rm -f "${generated}"' EXIT
          aspect generate-kip-matrix --output "${generated}"
          diff -u docs/KIP_MATRIX.md "${generated}"
      # docs/config-reference.md is rendered from docs/config-schema.json; a schema change without a regeneration fails here (the schema itself is compared against FileConfig by //crates/broker:config_reference_test).
      - name: generated config reference
        run: |
          generated="$(mktemp)"
          trap 'rm -f "${generated}"' EXIT
          aspect generate-config-reference --output "${generated}"
          diff -u docs/config-reference.md "${generated}"
      # `krabka-docgen` renders four pages out of the broker's own in-process data (docs/docgen-contract.md names each entry point). Render the whole tree into a temporary directory: a signature change that `crates/broker/tests/docgen_contract.rs` does not reach fails here instead of in the site build.
      # Absolute paths on both steps: `bazel run` puts the binary's own runfiles
      # tree on the working directory, not the workspace root, so a relative
      # `docs` would resolve against the wrong tree.
      #
      # `--symlink_prefix=/` on both steps: with the default prefix, `bazel run`
      # drops `bazel-krabka-broker` and friends into the workspace root, and
      # `bazel-krabka-broker/external` is a tree of third-party checkouts full of
      # `.md` files. The `markdown links` step below globs `./**/*.md`, so those
      # symlinks turned every broken relative link in zstd's and rules_rust's
      # own READMEs into a failure of this job. A slash prefix creates no
      # symlinks at all, which is what this job wants: it builds nothing a later
      # step has to find by path.
      - name: generated reference tree
        run: |
          out="$(mktemp -d)"
          trap 'rm -rf "${out}"' EXIT
          bazel run --symlink_prefix=/ //crates/docgen:krabka-docgen -- all --out "${out}"
      # The same tool rewrites every fenced block a page or crate README marks
      # with `<!-- snippet: <path>#<anchor> -->` from the source region carrying
      # the matching markers. A tree in sync does not change; stale quotes fail
      # the diff against the checked-in docs and crate READMEs.
      - name: quoted source snippets are current
        run: |
          bazel run --symlink_prefix=/ //crates/docgen:krabka-docgen -- \
            snippets --content "${PWD}/docs" --crates "${PWD}/crates"
          bazel run --symlink_prefix=/ //crates/docgen:krabka-docgen -- \
            snippets --content "${PWD}/crates" --crates "${PWD}/crates"
          git diff --exit-code -- docs crates
      # Every docs/KFCs/KFC-*.md carries the README's seven headings in order and a Status that matches the README index; the `the tasks' own tests` step above runs the unit tests that prove the check fails on a missing heading or a status mismatch.
      - name: KFC template
        run: aspect check-kfcs
      # Design-doc index, required headings, README links, and #fragment anchors (lychee below does not follow fragments).
      - name: design docs
        run: aspect check-design-docs
      # Every series the reference dashboard and the alert rules name must be one the broker exports; the metrics_contract suite keeps the body file fresh.
      - name: metrics contract
        run: aspect check-metrics-contract
      # An exclude_re entry pinned to a path that a refactor moved or renamed stops matching anything, and the mutant it used to suppress comes back as an unexplained survivor.
      - name: mutants config
        run: aspect check-mutants-config
      # A mutants::skip removes a function from the sweep, so an unexplained one silently shrinks the tier that measures the tests. Every skip states which of the README's two accepted reasons it is.
      - name: justified mutants::skip attributes
        run: aspect check-mutants-skip
      # Every crate has a README and the root README crate table names it.
      - name: crate READMEs
        run: aspect check-crate-readmes
      # Every row of the release support matrix has a status from its legend, an evidence link, and the revision it ran at; no row claims a candidate that is not frozen.
      - name: support matrix evidence
        run: aspect check-support-matrix
      # //bazel/images' IMAGES restates every //MODULE.bazel image pin as the tag the image is loaded under. A digest bump that moves the tag on one side only leaves a suite testing bytes its `const KAFKA_IMAGE` no longer describes.
      - name: pinned images
        run: aspect check-images
      # The workspace version is written by hand in `[workspace.package]`, in every first-party `path` dependency's version requirement, in `module()`, in `WORKSPACE_VERSION` and in each `html_root_url`. `bazel/defs.bzl` stamps `WORKSPACE_VERSION` into every crate's purl, so one left behind by a bump attests an SBOM naming the previous release; the release workflow runs this same check against the tag.
      - name: version pins
        run: aspect check-version-pins
      # The M20 candidate set is allowed to remain a draft while sibling-owned
      # implementation is unfinished, but its repository revisions, artifact
      # slots and four evidence gates may not silently disappear or drift.
      - name: ecosystem qualification manifest
        run: aspect check-qualification
      # `--exclude-path` on the Bazel convenience symlinks, belt and braces
      # beside the `--symlink_prefix=/` above: this repository's markdown is the
      # subject, and a third-party checkout under `bazel-*/external` is not.
      - name: markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}" --exclude-path bazel-krabka-broker --exclude-path bazel-out --exclude-path bazel-bin --exclude-path bazel-testlogs './**/*.md'

  # Re-discharge the Creusot proof sessions under `verif/`.
  #
  # The sessions are checked in, and nothing re-ran them before this job, so a
  # contract change could invalidate a proof and leave the stale session in the
  # tree with no signal. This proves them again on every change that reaches
  # them.
  #
  # Only a change that reaches the proofs' inputs runs it on a pull request or a
  # push (see `aspect changed-scope`); the nightly and a dispatch always run it,
  # and a release requires one of those to be green.
  #
  # It gates on the proof RESULT and never on the artifacts. A `.coma` file
  # embeds the absolute source path of the machine that wrote it, so a checkout
  # at any other path always differs and a `git diff --exit-code` over `verif/`
  # would fail every run for a reason that says nothing about the proofs.
  #
  # `cargo creusot` runs per crate. Running it bare builds the whole workspace,
  # including crates with no proof contracts, so discover the relevant members.
  proofs:
    name: creusot proofs
    needs: select
    if: needs.select.outputs.proofs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      # setup-aspect's log and BEP uploads, as in every other Bazel job.
      id-token: write
      # Publishing the proof image, on the runs that build one.
      packages: write
    env:
      # What the proof step runs, and what `image_load` writes locally.
      LOCAL_IMAGE: docker.io/krabka-io/creusot:0.14.0
      # Must match `image_push`'s registry and repository in //tools/creusot.
      REGISTRY_IMAGE: ghcr.io/krabka-io/creusot
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The CLI alone, and unconditionally: the tag below is what decides
      # whether this job builds anything, so it has to be resolved before the
      # cache-warming setup further down knows whether it is wanted. The Bazel
      # caches stay on that second step, on the path that actually runs Bazel.
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # A digest of everything that decides the image's contents. See
      # //tools/creusot for why the registry, and not the Bazel disk cache, is
      # what keeps CI from reinstalling Creusot on every run.
      - id: image
        name: resolve the proof image tag
        run: echo "tag=$(aspect creusot-image-tag)" >>"${GITHUB_OUTPUT}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A miss is a normal outcome, not a failure: the tag is new, or this is a
      # fork whose token cannot read the package. Either way the job falls
      # through to building the image, which is what it always used to do.
      - id: cached
        name: reuse the published proof image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          if docker pull "${IMAGE}"; then
            docker tag "${IMAGE}" "${LOCAL_IMAGE}"
            echo "hit=true" >>"${GITHUB_OUTPUT}"
          else
            echo "hit=false" >>"${GITHUB_OUTPUT}"
          fi

      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        if: steps.cached.outputs.hit != 'true'
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # `--verbose_failures`: the toolchain layer is built by a genrule that
      # shells out to Docker, and when it fails Bazel otherwise reports only
      # "Target //tools/creusot:image_load failed to build" with no command and
      # no output. The flag is what makes that action's failure diagnosable
      # from the log alone.
      - name: build the pinned proof image
        if: steps.cached.outputs.hit != 'true'
        run: bazel run --verbose_failures //tools/creusot:image_load

      # Before the proofs, not after: the image is valid whether or not the
      # proofs it runs pass, and publishing it here means a failing run's retry
      # already has it. A fork's token is read-only, so it keeps its build.
      - name: publish the proof image
        if: steps.cached.outputs.hit != 'true' && github.event.pull_request.head.repo.fork != true
        run: bazel run //tools/creusot:push -- --tag "${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}

      # The runner supplies only the Docker kernel boundary and the checkout.
      # Rust, OCaml, opam, Why3, the provers, Python and native libraries all
      # come from the apko/rules_img image.
      - name: prove
        run: |
          docker run --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace \
            "${LOCAL_IMAGE}"

  # Container suites, sharded across runners.
  #
  # These saturate a runner: the suites are container-heavy, so Bazel got only
  # about 1.2x concurrency running them together and the box, not the target
  # granularity, was the limit. Sharding them across runners is what actually
  # parallelises them -- one job per group of suites, so the wall clock is the
  # slowest group rather than the sum of all of them.
  #
  # `aspect test` does not narrow to impacted targets -- that is an Aspect
  # Workflows feature, not part of the open-source CLI. The custom `aspect
  # container-suites` task owns the selection: scheduled/manual runs take every
  # suite, while PRs use Bazel rdeps outside the broker and an explicit broker
  # feature map so one Rust target does not become the entire JVM matrix.
  #
  # A matrix entry is a GROUP of targets rather than a single one, and the task
  # emits at most 12 of them. The cap is the concurrency budget: GitHub runs at
  # most 20 jobs at once for this account, and the rest of the workflow already
  # claims several, so a matrix wider than that queues into a second wave and
  # the run's wall clock becomes two container jobs deep instead of one. Twelve
  # entries fit alongside the other jobs in a single wave. Grouping is also
  # cheaper per target: the suites in a group are tested by one Bazel
  # invocation, which analyses and compiles the shared broker closure once
  # rather than once per suite.
  #
  # This job also answers, through `aspect changed-scope`, whether the change
  # reaches the Rust build, the kind smoke test's inputs and the Creusot
  # proofs' inputs, which is what lets `cargo`, `wasm`, `kubernetes` and
  # `proofs` sit out a pull request that cannot affect them.
  select:
    name: select
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      any: ${{ steps.select.outputs.any }}
      rust: ${{ steps.scope.outputs.rust }}
      kubernetes: ${{ steps.scope.outputs.kubernetes }}
      proofs: ${{ steps.scope.outputs.proofs }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # rdeps needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      - id: select
        run: |
          set -euo pipefail
          if [ "${FULL_MATRIX}" = "true" ]; then
            aspect container-suites
          else
            aspect container-suites --base "${BASE_SHA}"
          fi

      # A second reading of the same diff, on the same checkout, so this costs
      # a job slot nothing. `--base` is omitted on the full-matrix runs for the
      # same reason `container-suites` omits it: with no merge base to compare
      # against there is no diff to narrow by, and `changed-scope` fails open to
      # every scope `true` -- which is what a scheduled or dispatched run wants
      # anyway.
      - id: scope
        run: |
          set -euo pipefail
          if [ "${FULL_MATRIX}" = "true" ]; then
            aspect changed-scope
          else
            aspect changed-scope --base "${BASE_SHA}"
          fi

  docker:
    name: container · ${{ matrix.suite.name }}
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      # One group failing should not cancel the rest -- the point of the shard
      # is to see every suite's result in one run.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # The host side of these suites reaches the broker over loopback, but a few
      # host-side Rust clients bootstrap through the advertised name, so it has to
      # resolve here too. Containers resolve it separately, through
      # `--add-host=host.docker.internal:host-gateway`.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      # `aspect container-suites` selects by touched path, so a group can name a
      # container target that is not a test rule -- the KDC fixture's `image`
      # and `seed_layer` are built, not run. `bazel test` exits 4 on a label
      # with no test targets ("No test targets were found, yet testing was
      # requested"), which failed every suite in the matrix regardless of the
      # code under review. Dispatch on the rule kind instead.
      #
      # One `bazel query` over the whole group, then at most one `bazel test`
      # and at most one `bazel build` -- never a command per target. Sharing an
      # invocation is the point of grouping: the group's suites analyse and
      # compile the broker closure once between them, where a loop paid for it
      # per target.
      #
      # `matrix.suite.targets` arrives through `env` rather than as a `${{ }}`
      # interpolation into the script body, so a label can never be read as
      # shell. It is a space-joined list, which `set(...)` takes verbatim.
      - env:
          TARGETS: ${{ matrix.suite.targets }}
        run: |
          set -euo pipefail
          # Assigned before the loop reads it: a command substitution in a
          # here-string word is not a simple command, so `set -e` would not
          # abort on a failed query there and the group would pass having run
          # nothing.
          labels="$(bazel query --output=label_kind "set(${TARGETS})")"
          tests=""
          builds=""
          # `--output=label_kind` prints "<kind> <rule|file> <label>", so the
          # kind is the first word and the label the last.
          while read -r kind _ label; do
            [ -n "${label}" ] || continue
            case "${kind}" in
              *_test) tests="${tests} ${label}" ;;
              *) builds="${builds} ${label}" ;;
            esac
          done <<<"${labels}"
          if [ -z "${tests}" ] && [ -z "${builds}" ]; then
            printf 'No labels resolved for group targets: %s\n' "${TARGETS}" >&2
            exit 1
          fi
          # `--config=docker-rbe` is defined for `test` only (it swaps the
          # `--test_tag_filters` set), so passing it to `build` fails with
          # "Config value 'docker-rbe' is not defined in any .rc file".
          #
          # It runs the suites on BuildBuddy Firecracker microVMs, each with its
          # own dockerd, rather than on this runner's daemon. The compile stays
          # here -- see the `docker-rbe` block in `.bazelrc`.
          if [ -n "${tests}" ]; then
            bazel test --config=docker-rbe ${tests}
          fi
          if [ -n "${builds}" ]; then
            bazel build ${builds}
          fi

  # The kind smoke test runs on a pull request or push only when the change
  # reaches the image packaging or the cluster manifests (see `aspect
  # changed-scope`). The nightly and a dispatch always run it, and a release
  # requires one of those to be green.
  kubernetes:
    name: kubernetes · kind
    needs: select
    if: needs.select.outputs.kubernetes == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: krabka
          config: .github/kind.yaml
      - run: bash packaging/k8s/kind-smoke.sh

  upgrade:
    name: upgrade · previous release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash packaging/upgrade-smoke.sh

  # The KDC fixture writes fresh keytabs through a bind mount. Keep the two
  # Kerberos acceptance cases visible in their own scheduled lane instead of
  # leaving them permanently #[ignore]d.
  gssapi:
    name: container · gssapi
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: load KDC image
        run: bazel run //crates/broker/tests/fixtures/security/kdc:image_load
      - name: run GSSAPI acceptance suites
        env:
          KRB5_CONFIG: ${{ github.workspace }}/crates/broker/tests/fixtures/security/kdc/krb5.conf
          RUST_LOG: warn
          SSPI_KDC_URL: tcp://localhost:88
        run: |
          set -euo pipefail
          fixture=crates/broker/tests/fixtures/security/kdc/docker-compose.yml
          trap 'docker compose -f "${fixture}" down' EXIT
          docker compose -f "${fixture}" up -d
          timeout 60 sh -c 'until docker compose -f "$1" logs kdc | grep -q KDC_READY; do sleep 1; done' _ "${fixture}"
          cargo test -p krabka-broker --test gssapi_e2e --test auth_handlers gssapi -- --ignored --test-threads=1

  # Four hours of continuous traffic across a three-broker cluster, and a
  # failure when a resource level drifts rather than only when something
  # crashes.
  #
  # Its own job, and not a member of the `docker` matrix, for two reasons. The
  # matrix is a twelve-way shard of suites that finish in minutes, and one
  # four-hour member would hold the whole shard -- and the nightly report that
  # waits on it -- open for four hours. And the matrix runs on every pull
  # request whose diff selects a suite, which is exactly what a four-hour lane
  # must never do. `.aspect/container_suites.axl` drops
  # `//crates/broker:soak_docker_test` from every selection it makes, with a
  # unit test that says so; this is the only job that names it.
  #
  # `--test_timeout` because Bazel's longest built-in timeout, `eternal`, is
  # one hour. The value is the soak plus an hour for the image load, the
  # cluster boot and the read-back at the end.
  #
  # `--flaky_test_attempts=1` because every `_docker_test` is `flaky`, which
  # gives it three attempts, and a second four-hour attempt cannot finish
  # inside `timeout-minutes`. With the retry, every failed soak from
  # 2026-10-06 to 10-18 ended as a job cancelled at the time limit, not as a
  # failure.
  soak:
    name: soak · four hours
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # The soak itself is four hours; the rest is the compile, the image and the
    # verification pass.
    timeout-minutes: 330
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/reclaim-disk

      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # Each broker advertises `host.docker.internal` so that its two peers and
      # the host-side clients reach it by one name. The containers resolve it
      # through `--add-host=host.docker.internal:host-gateway`; the host needs
      # this line, exactly as the `docker` matrix does.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: soak
        env:
          KRABKA_SOAK_SECONDS: "14400"
        run: |
          set -euo pipefail
          bazel test \
            --config=docker \
            --bes_backend= \
            --test_timeout=18000 \
            --flaky_test_attempts=1 \
            --test_env=KRABKA_SOAK_SECONDS \
            --test_output=streamed \
            //crates/broker:soak_docker_test

  # The slow-follower fault of the 72-hour contract, `tc netem` in a broker's
  # network namespace, had never run: no kernel the repository tested on had
  # `sch_netem` (release blocker B7). `bench/soak/self-check-netem.yaml` is the
  # self-check with that one fault changed, and this job runs it on a
  # GitHub-hosted runner. The module is loaded first, so a runner without it
  # fails here, by name, instead of as a fault the executor could not inject.
  #
  # Scheduled and dispatched only, like `soak`: the pull-request container
  # matrix keeps the CPU-quota self-check, because its remote executors may
  # lack the module. `--flaky_test_attempts=1` so that a failure is reported,
  # not retried away.
  netem:
    name: netem · slow-follower self-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/reclaim-disk

      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Off explicitly, as in `soak`: the remote cache covers it.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}

      # As in `soak`: every broker advertises `host.docker.internal`.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: load sch_netem
        run: |
          set -euo pipefail
          sudo modprobe sch_netem
          grep -w sch_netem /proc/modules

      - name: netem self-check
        run: |
          set -euo pipefail
          bazel test \
            --config=docker \
            --bes_backend= \
            --flaky_test_attempts=1 \
            --test_env=KRABKA_SOAK_CONTRACT=bench/soak/self-check-netem.yaml \
            --test_output=streamed \
            //crates/broker:soak_contract_docker_test

  # The external half of the link check.
  #
  # `checks` runs lychee with `--offline`, which resolves file-relative links
  # and nothing else. That is deliberate on a pull request: the merge gate does
  # not go red because Confluence was slow. It also means the ~180 http links
  # across `**/*.md` -- KIP pages on cwiki, `kafka.apache.org/<version>/` paths,
  # docs.rs items -- were checked by nobody, so a renamed Confluence page or a
  # moved documentation path 404s silently and leaves a citation no reader can
  # follow. This lane fetches them once a day, where a flake costs a re-run
  # rather than a merge.
  #
  # `token:` is what keeps the ~78 github.com links from spending the
  # unauthenticated 60-requests-an-hour budget in the first minute.
  #
  # The two `--exclude` patterns are compose-internal hostnames written as
  # example configuration values (`docs/config-reference.md` and
  # `docs/KFCs/KFC-7-broker-side-schema-validation.md`): they resolve inside a
  # deployment and nowhere else, and no run of this check can ever reach them.
  # They live here rather than in `.lycheeignore` so that file stays a record of
  # links this lane has actually proven unreachable.
  links:
    name: external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdown links (external)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --no-progress --root-dir "${{ github.workspace }}" --max-retries 3 --exclude '^http://schema-registry:8081' --exclude '^http://opa:8181' './**/*.md'

  # The criterion benches, on the nightly schedule and on demand.
  #
  # Each side runs four times, alternating on the same host. The verdict uses
  # medians and three times the larger median absolute deviation, with a 10%
  # floor. Missing or invalid samples fail. Raw output, exact commits and host
  # resources travel with the verdict artifact. Pull requests only compile the
  # benches; this eight-pass lane is nightly and manually dispatchable.
  bench:
    name: variance-calibrated criterion benches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # Four alternating reference/candidate passes over all seven suites.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/reclaim-disk

      # Same three steps as `cargo`, for the same reason: `rust-toolchain.toml`
      # is the single pin, so read the channel out of it rather than restating
      # it here.
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own namespace: the bench profile's artifacts are not the ones
          # `cargo`'s clippy and nextest run leaves behind.
          key: bench

      - id: reference
        name: resolve reference
        env:
          REFERENCE_INPUT: ${{ inputs.reference_sha }}
        run: |
          set -euo pipefail
          reference_sha="${REFERENCE_INPUT}"
          if [ -z "${reference_sha}" ]; then
            reference_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${reference_sha}^{commit}"
          echo "sha=$(git rev-parse "${reference_sha}^{commit}")" >> "${GITHUB_OUTPUT}"

      - name: repeated same-host measurements
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          reference_dir="${RUNNER_TEMP}/krabka-benchmark-reference"
          git worktree add --detach "${reference_dir}" '${{ steps.reference.outputs.sha }}'
          mkdir -p benchmark-artifacts/{reference,candidate}/summaries
          {
            echo "candidate=${candidate_sha}"
            echo "reference=${{ steps.reference.outputs.sha }}"
            rustc -Vv
            uname -a
            lscpu
            free -b
            df -B1 .
          } > benchmark-artifacts/environment.txt
          # Both Bazel release graphs enable tracing/log. Cargo dev dependencies
          # enable it only on some revisions, so match it explicitly on both sides.
          for side in reference candidate; do
            source_dir="${reference_dir}"
            if [ "${side}" = candidate ]; then source_dir="${GITHUB_WORKSPACE}"; fi
            (cd "${source_dir}" && cargo tree --locked -p krabka-broker -p krabka-log \
              --features tracing/log -e features -i tracing) \
              > "benchmark-artifacts/${side}/tracing-features.txt"
          done
          for run in 1 2 3 4; do
            sides=(reference candidate)
            if ((run % 2 == 0)); then
              sides=(candidate reference)
            fi
            for side in "${sides[@]}"; do
              run_dir="benchmark-artifacts/${side}/run-${run}"
              mkdir -p "${run_dir}"
              if [ "${side}" = reference ]; then
                source_dir="${reference_dir}"
                commit='${{ steps.reference.outputs.sha }}'
              else
                source_dir="${GITHUB_WORKSPACE}"
                commit="${candidate_sha}"
              fi
              (
                cd "${source_dir}"
                CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target" cargo bench \
                  -p krabka-broker -p krabka-log --features tracing/log --bench '*' -- \
                  --output-format bencher --noplot --sample-size 20 --measurement-time 2
              ) | tee "${run_dir}/raw.txt"
              cargo run -p krabka-parse-benches -- \
                --results-dir "${run_dir}" \
                --output "benchmark-artifacts/${side}/summaries/run-${run}.json" \
                --suite krabka-broker \
                --commit "${commit}"
            done
          done

      - name: regression verdict
        run: |
          cargo run -p krabka-parse-benches -- \
            --reference-dir benchmark-artifacts/reference/summaries \
            --candidate-dir benchmark-artifacts/candidate/summaries \
            --minimum-tolerance-percent 10 \
            --output benchmark-artifacts/verdict.json

      - name: summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## variance-calibrated criterion verdict'
            echo
            echo '```'
            if [ -f benchmark-artifacts/verdict.json ]; then
              jq -r '"passed=\(.passed)\nbenchmarks=\(.benchmarks | length)\nreference=\(.reference_commits[0])\ncandidate=\(.candidate_commits[0])"' benchmark-artifacts/verdict.json
            else
              echo 'No verdict: measurement or validation failed.'
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: upload raw samples and verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-regression-evidence
          path: benchmark-artifacts/
          retention-days: 90

  # Push the broker image and the benchmark driver image.
  #
  # Not `aspect delivery`: its "only what changed" tracking needs
  # `ASPECT_WORKFLOWS_DELIVERY_API_ENDPOINT`, a state backend that comes with
  # Aspect Workflows rather than the open-source CLI. Without it the task refuses
  # to run except with `--mode=always`, which is what a plain push already is.
  #
  # Pushing unconditionally costs less than it sounds: the image is
  # content-addressed, so a registry that already holds these layers takes the
  # manifest and skips the blobs. Revisit if Workflows is ever adopted.
  delivery:
    name: delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, coverage, supply-chain]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: test the delivery image
        run: bazel test -c opt --config=docker //packaging:image_docker_test
      - name: push
        run: bazel run -c opt //packaging:push -- --tag "${GITHUB_SHA}"

      # The benchmark driver image, built the same way. `bench/manifests/driver`
      # runs it as a Kubernetes Job, and `BENCH_DRIVER_IMAGE` names the tag.
      # The `ci` job's `build` step builds it on every pull request.
      - name: push the benchmark driver image
        run: bazel run -c opt //bench:driver_push -- --tag "${GITHUB_SHA}"

      - name: record the delivery image digest
        run: |
          bazel build -c opt //packaging:image_manifest_blob
          manifest="$(bazel cquery -c opt //packaging:image_manifest_blob --output=files)"
          printf 'sha256:%s\n' "$(sha256sum "${manifest}" | cut -d ' ' -f 1)" >delivery-image.digest
          aspect check-delivery-image --expected delivery-image.digest \
            --image "ghcr.io/krabka-io/krabka-broker:${GITHUB_SHA}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-image
          path: delivery-image.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # The single context `main` requires, and the reason the list of required
  # checks is one name rather than one name per job.
  #
  # Branch protection can only name checks statically, and `docker` is a matrix
  # built from the impacted-suite query, so its jobs are named at run time and
  # can never appear in that list. Before this job the protected set was `build
  # · test · lint · format`, `coverage` and `docgen`: `cargo deny`, the Cargo
  # clippy and nextest lane, the Creusot proofs and every container suite could
  # go red without blocking a merge.
  # This job depends on all of them, so protection needs only this one name and
  # a job added below is covered by adding it to `needs`.
  #
  # `always()` is what makes this a gate rather than a rubber stamp. Without it
  # a failed dependency leaves this job skipped, GitHub counts a skipped
  # required check as satisfied, and a red run becomes mergeable -- the exact
  # failure this job exists to prevent.
  #
  # Two dependencies are allowed to be skipped, and only those two. `docker` is
  # `if`-gated on the suite selection being non-empty, so a change impacting no
  # container suite legitimately runs none. `coverage` is `if`-gated on the
  # pull request touching Rust or build inputs, so a docs-only pull request
  # legitimately runs none either -- and only a pull request can skip it, since
  # a push to `main` runs coverage unconditionally. Neither indulgence can hide
  # a broken selection, because a `select` failure is read here on its own
  # account.
  gate:
    name: gate
    # Mergeability: pull requests, and the pushes to `main` that follow them.
    # The scheduled lanes report through their own jobs and gate nothing.
    if: always() && github.event_name != 'schedule'
    needs:
      - cpd
      - ci
      - coverage
      - supply-chain
      - cargo
      - wasm
      - checks
      - proofs
      - select
      - docker
      - kubernetes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: require every dependency to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"${NEEDS}" | sort
          unmet="$(
            jq -r '
              ["cargo", "coverage", "docker", "kubernetes", "proofs", "wasm"] as $may_skip
              | to_entries[]
              | . as $dep
              | select($dep.value.result != "success")
              | select(($dep.value.result == "skipped" and ($may_skip | index($dep.key)) != null) | not)
              | "  \($dep.key): \($dep.value.result)"
            ' <<<"${NEEDS}"
          )"
          if [ -n "${unmet}" ]; then
            printf 'Gate failed. These jobs did not succeed:\n%s\n' "${unmet}" >&2
            exit 1
          fi
          echo 'Gate passed: every job that gates a merge succeeded.'

  # The scheduled lanes' only reader.
  #
  # `docker` (the full JVM/librdkafka container matrix), `gssapi` (both
  # Kerberos acceptance cases), `links` (every external URL in the markdown
  # the pull-request lychee run skips under `--offline`) and `bench` (the seven
  # criterion suites) run once a day, on the 05:00 UTC schedule, and `gate`
  # deliberately excludes scheduled runs -- they gate no merge. Nothing else consumed their result, so a red nightly was
  # visible only to whoever opened the Actions tab. This job is what turns it
  # into an issue, and it is the only reporting path the scheduled lanes have:
  # a new lane extends `needs` here rather than filing on its own.
  #
  # `select` is on `needs` alongside the two lanes it feeds. A `select` failure
  # leaves `docker` *skipped* rather than failed, and a skip is not a failure
  # here (see below) -- so without this dependency a nightly whose suite query
  # died would close the issue and report itself green.
  #
  # `gh` rather than `actions/github-script`: every other piece of logic in this
  # workflow is an inline `run:` script, secrets already reach steps as `env`
  # (see `delivery`'s registry login), and `gh` is preinstalled on the runner,
  # so this adds no fourth pinned action for three API calls.
  #
  # The label name and the body-building live in one place each so that #403 can
  # point `mutants.yml`'s schedule at the same mechanism.
  nightly-report:
    name: nightly report
    needs: [select, docker, gssapi, links, bench, soak, netem, kubernetes, proofs, upgrade]
    # `always()`: the whole point is to run when a dependency failed, and a
    # plain `needs` would skip this job exactly then.
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The workflow-level block is `contents: read` + `id-token: write`. This is
    # the only job that writes issues, so the grant stays here rather than
    # widening every job's token.
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh` resolves the repository from a git remote, and this job has no
      # checkout -- it needs none. `GH_REPO` is what stands in for one.
      GH_REPO: ${{ github.repository }}
      LABEL: nightly-red
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      # `gh issue create --label` fails outright when the label does not exist,
      # which would turn "the nightly is red" into "the reporting job is red"
      # with nothing filed. Creating it here keeps the workflow self-sufficient:
      # nobody has to have run a one-off `gh label create` against the
      # repository first. `--force` makes it idempotent.
      - name: ensure the label exists
        run: |
          set -euo pipefail
          gh label create "${LABEL}" \
            --color b60205 \
            --description 'A scheduled lane failed; a green scheduled run closes this' \
            --force

      # `contains(needs.*.result, 'failure')` and nothing else. `needs.*.result`
      # also yields `skipped` and `cancelled`, and neither is a red lane:
      # `gssapi`, `soak` and `netem` are skipped on any event that is not a schedule or a
      # dispatch, `docker` is skipped when the suite selection is empty, and a
      # cancelled run means a human or the concurrency group stopped it.
      # (`links` and `bench` are the two dependencies that cannot be skipped
      # here: both `if:`s admit the same `schedule` this job's does, so on a
      # scheduled run each always has a `success`, `failure` or `cancelled` of
      # its own.)
      - name: report the failure
        if: contains(needs.*.result, 'failure')
        run: |
          set -euo pipefail
          failed="$(jq -r '
            to_entries[] | select(.value.result == "failure") | "- `\(.key)`"
          ' <<<"${NEEDS}")"
          # A red `links` lane is the one failure whose fix is not in the code,
          # so the issue says where the two answers live.
          hint=''
          if [ "$(jq -r '.links.result' <<<"${NEEDS}")" = failure ]; then
            hint=$'\nA broken link is either wrong -- fix the markdown -- or correct but permanently unreachable to a checker, Confluence answering 403 to bots being the usual case, and that one goes in `.lycheeignore` with a line saying why.\n'
          fi
          # A red `bench` lane leaves no baseline for the next run to compare
          # against, so the issue says where this run's numbers went.
          if [ "$(jq -r '.bench.result' <<<"${NEEDS}")" = failure ]; then
            hint="${hint}"$'\nThe criterion lane failed, so no `main` baseline was published and the next run measures absolute times only. This run\'s partial output is in the job summary; the `criterion-baseline` artifact, if the upload got that far, holds the samples.\n'
          fi
          body="$(printf '%s\n\nFailed jobs:\n\n%s\n%s\nRun: %s\n' \
            "The scheduled \`${GITHUB_WORKFLOW}\` run failed." "${failed}" "${hint}" "${RUN_URL}")"
          number="$(gh issue list \
            --label "${LABEL}" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create \
              --label "${LABEL}" \
              --title "Nightly ${GITHUB_WORKFLOW} is red" \
              --body "${body}"
          fi

      # The complement, minus cancellations: a run somebody stopped part-way
      # proves nothing green, so it neither files nor closes anything. Every
      # open issue rather than the first, so a label applied by hand to a second
      # one does not leave it open forever.
      - name: close the issue on a green run
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          for number in $(gh issue list \
            --label "${LABEL}" --state open --limit 100 \
            --json number --jq '.[].number'); do
            gh issue close "${number}" \
              --reason completed \
              --comment "The scheduled \`${GITHUB_WORKFLOW}\` run is green again: ${RUN_URL}"
          done
