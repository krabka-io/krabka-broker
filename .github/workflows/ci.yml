name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the full container run and the mutation sweep.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build, test, lint and format. The Aspect CLI narrows each of these to what
  # the change actually touched; `bazel build|test //...` is the equivalent for
  # anyone without the CLI, and is what the nightly job runs.
  ci:
    name: build · test · lint · format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true

      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format

      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI.
      - name: lint
        run: aspect lint

      - name: build
        run: aspect build --bazel-flag=--build_tag_filters=-docker //...

      - name: test
        run: aspect test --bazel-flag=--test_tag_filters=-docker //...

  # LCOV over the first-party crates. Separate from `ci` because instrumented
  # binaries are a different build, so sharing that job's cache would only
  # evict it.
  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      - run: bazel coverage //crates/...
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: true

  supply-chain:
    name: cargo deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # rustdoc for every crate, kept as an artifact. The `ci` job already builds
  # these -- a `rust_doc` per crate is an ordinary target -- so this exists to
  # publish the output, and to keep rendering the whole set even when `aspect
  # build` narrowed to the crates a change touched.
  docs:
    name: docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: generated KIP matrix
        run: |
          generated="$(mktemp)"
          trap 'rm -f "${generated}"' EXIT
          python3 tools/generate-kip-matrix.py "${generated}"
          diff -u docs/KIP_MATRIX.md "${generated}"
      - name: markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}" './**/*.md'
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docs
          repository-cache: true
      - run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

  # Re-discharge the Creusot proof sessions under `verif/`.
  #
  # The sessions are checked in, and nothing re-ran them before this job, so a
  # contract change could invalidate a proof and leave the stale session in the
  # tree with no signal. This proves them again on every change.
  #
  # It gates on the proof RESULT and never on the artifacts. A `.coma` file
  # embeds the absolute source path of the machine that wrote it, so a checkout
  # at any other path always differs and a `git diff --exit-code` over `verif/`
  # would fail every run for a reason that says nothing about the proofs.
  #
  # `cargo creusot` runs per crate. Running it bare builds the whole workspace,
  # including crates with no proof contracts, so discover the relevant members.
  proofs:
    name: creusot proofs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # `why3-ide` is a hard dependency of the `creusot-deps` opam package and
      # needs GTK. opam syncs its local pin with `rsync`, and fails the whole
      # install without it.
      - name: system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            opam ocaml-nox build-essential pkg-config libgmp-dev libmpfr-dev \
            m4 unzip autoconf rsync libgtk-3-dev libgtksourceview-3.0-dev

      - name: read the pinned Creusot version
        id: creusot
        run: echo "version=$(cat .creusot-version)" >>"${GITHUB_OUTPUT}"

      # The opam switch builds why3 from source, which is the slow part of a
      # cold run. Key the cache on the Creusot pin and the prover profile, so a
      # bump of either rebuilds and nothing else does.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            ~/.local/share/creusot
          key: creusot-${{ runner.os }}-${{ hashFiles('.creusot-version', 'why3find.json') }}

      - name: opam
        run: opam init --disable-sandboxing --bare -y --no-setup

      # `creusot-rustc` links against the compiler internals of one exact
      # nightly, which Creusot pins in its own repository, so the toolchain
      # comes from there rather than from this repository's pin. Its installer
      # places every component, including the Why3 prelude package and the four
      # provers `why3find.json` names.
      - name: creusot toolchain
        env:
          OPAMYES: "1"
          OPAMCONFIRMLEVEL: unsafe-yes
        run: |
          git clone --depth 1 --branch "${{ steps.creusot.outputs.version }}" \
            https://github.com/creusot-rs/creusot /tmp/creusot
          rustup toolchain install \
            "$(sed -n 's/^channel = "\(.*\)"/\1/p' /tmp/creusot/rust-toolchain)" \
            --component rustfmt --component rustc-dev --component llvm-tools \
            --profile minimal
          cd /tmp/creusot
          cargo run --bin creusot-install -- \
            prelude why3 provers why3-conf cargo-creusot creusot-rustc \
            cargo-creusot-config

      # A non-zero exit or any unproved goal fails the job. Check the explicit
      # proof list first so adding a contract-bearing crate cannot silently
      # leave it outside this gate.
      - name: prove
        run: |
          export PATH="${HOME}/.local/share/creusot/bin:${PATH}"
          python3 tools/test_creusot_packages.py
          packages=(krabka-verified)
          python3 tools/creusot_packages.py "${packages[@]}"
          for package in "${packages[@]}"; do
            cargo creusot --package "${package}"
          done

  # Container suites, one runner each.
  #
  # These saturate a runner: the suites are container-heavy, so Bazel got only
  # about 1.2x concurrency running them together and the box, not the target
  # granularity, was the limit. Sharding them across runners is what actually
  # parallelises them -- one job per suite, so the wall clock is the slowest
  # suite rather than the sum of all of them.
  #
  # `aspect test` does not narrow to impacted targets -- that is an Aspect
  # Workflows feature, not part of the open-source CLI -- so the set is computed
  # here: reverse dependencies of the files a change touched, intersected with
  # the targets tagged `docker`. A scheduled or manual run takes every suite
  # instead, because a green impacted run says "nothing impacted broke", not
  # "the container suites pass".
  docker-select:
    name: select container suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          # rdeps needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docker
          repository-cache: true

      - id: select
        run: |
          set -euo pipefail
          all() { bazel query 'attr(tags, "docker", //crates/...)'; }

          event="${{ github.event_name }}"
          if [ "${event}" = "schedule" ] || [ "${event}" = "workflow_dispatch" ]; then
            targets="$(all)"
          else
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # No usable base (first push on a branch, force-push): run them all
              # rather than silently skipping.
              targets="$(all)"
            else
              changed="$(git diff --name-only "${base}...HEAD")"

              # Build-wide inputs reach every target, and most are not Bazel
              # targets at all -- `rdeps` takes a target set, and `//:MODULE.bazel`
              # is a source file no rule exports. Treat them as "everything"
              # rather than trying to name them.
              if grep -qE '^(MODULE\.bazel|\.bazelrc|Cargo\.lock|Cargo\.toml|bazel/|tools/)' <<<"${changed}"; then
                targets="$(all)"
              else
                # `rdeps` takes a target set, so every path here must be a
                # target Bazel knows. A crate README is not one: no rule globs
                # it and no crate pulls one in with `include_str!`. Nor is a
                # criterion bench: `[[bench]]` has no rule in //bazel/defs.bzl,
                # so a `benches/` source belongs to no target either. Feeding
                # such a path to `set(...)` fails the whole query, so a
                # documentation-only or bench-only change would kill the suite
                # selection rather than select nothing.
                mapfile -t files < <(grep -E '^crates/' <<<"${changed}" |
                  grep -vE '\.md$|(^|/)benches/' | while read -r f; do
                  [ -e "${f}" ] && printf '%s\n' "${f}"
                done)
                if [ "${#files[@]}" -eq 0 ]; then
                  targets=""
                else
                  targets="$(bazel query "attr(tags, 'docker', rdeps(//crates/..., set(${files[*]})))")"
                fi
              fi
            fi
          fi

          # One matrix entry per target, `name` being the bare suite for the job
          # label -- the full label is too long to read in the checks list.
          # `grep` finding nothing is the empty selection, not an error, and a
          # bare `[ ] && x` would exit under `set -e` whenever the test is false.
          suites="$(
            printf '%s\n' "${targets}" | { grep -E '^//' || true; } |
              jq -R -s -c 'split("\n") | map(select(length > 0)) |
                map({target: ., name: (. | split(":")[1] | sub("_docker_test$"; ""))})'
          )"
          if [ -z "${suites}" ]; then suites='[]'; fi
          echo "suites=${suites}" >>"${GITHUB_OUTPUT}"
          echo "any=$([ "${suites}" = '[]' ] && echo false || echo true)" >>"${GITHUB_OUTPUT}"
          echo "Selected: ${suites}"

  docker:
    name: container · ${{ matrix.suite.name }}
    needs: docker-select
    if: needs.docker-select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One suite failing should not cancel the rest -- the point of the shard
      # is to see every suite's result in one run.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.docker-select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docker
          repository-cache: true

      # The host side of these suites reaches the broker over loopback, but a few
      # host-side Rust clients bootstrap through the advertised name, so it has to
      # resolve here too. Containers resolve it separately, through
      # `--add-host=host.docker.internal:host-gateway`.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - run: bazel test --config=docker ${{ matrix.suite.target }}

  # The KDC fixture builds Debian packages and writes fresh keytabs through a
  # bind mount, so it cannot be loaded as one of //bazel/images' immutable
  # tarballs. Keep the two Kerberos acceptance cases visible in their own
  # scheduled lane instead of leaving them permanently #[ignore]d.
  gssapi:
    name: container · gssapi
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: run GSSAPI acceptance suites
        env:
          KRB5_CONFIG: ${{ github.workspace }}/crates/broker/tests/fixtures/security/kdc/krb5.conf
          RUST_LOG: warn
          SSPI_KDC_URL: tcp://localhost:88
        run: |
          set -euo pipefail
          fixture=crates/broker/tests/fixtures/security/kdc/docker-compose.yml
          trap 'docker compose -f "${fixture}" down' EXIT
          docker compose -f "${fixture}" up --build -d
          timeout 60 sh -c 'until docker compose -f "$1" logs kdc | grep -q KDC_READY; do sleep 1; done' _ "${fixture}"
          cargo test -p krabka-broker --test gssapi_e2e --test auth_handlers gssapi -- --ignored --test-threads=1

  # The mutation rule runs unit tests only. Scope the blocking sweep to the
  # consensus engine, whose decision logic is pure and unit-tested; the checked
  # in `.cargo/mutants-baseline.txt` makes any survivor-set change blocking.
  mutants-select:
    name: select mutants targets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      crates: ${{ steps.select.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - id: select
        run: |
          set -euo pipefail
          crates='[{"target":"//crates/raft:raft_mutants","name":"raft","minutes":60}]'
          echo "crates=${crates}" >>"${GITHUB_OUTPUT}"
          echo "Selected: ${crates}"

  mutants:
    name: mutants · ${{ matrix.crate.name }}
    needs: mutants-select
    runs-on: ubuntu-latest
    # A bound, not an estimate. A crate that cannot finish inside it is saying
    # its shard count is too low, and that is worth being told.
    timeout-minutes: ${{ matrix.crate.minutes }}
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.mutants-select.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - run: bash tools/check-mutants.sh ${{ matrix.crate.target }}

  # Push the broker image.
  #
  # Not `aspect delivery`: its "only what changed" tracking needs
  # `ASPECT_WORKFLOWS_DELIVERY_API_ENDPOINT`, a state backend that comes with
  # Aspect Workflows rather than the open-source CLI. Without it the task refuses
  # to run except with `--mode=always`, which is what a plain push already is.
  #
  # Pushing unconditionally costs less than it sounds: the image is
  # content-addressed, so a registry that already holds these layers takes the
  # manifest and skips the blobs. Revisit if Workflows is ever adopted.
  delivery:
    name: delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        run: bazel run //packaging:push -- --tag "${GITHUB_SHA}"

  # The single context `main` requires, and the reason the list of required
  # checks is one name rather than one name per job.
  #
  # Branch protection can only name checks statically, and `docker` is a matrix
  # built from the impacted-suite query, so its jobs are named at run time and
  # can never appear in that list. Before this job the protected set was `build
  # · test · lint · format`, `coverage` and `docgen`: `cargo deny`, the Creusot
  # proofs and every container suite could go red without blocking a merge.
  # This job depends on all of them, so protection needs only this one name and
  # a job added below is covered by adding it to `needs`.
  #
  # `always()` is what makes this a gate rather than a rubber stamp. Without it
  # a failed dependency leaves this job skipped, GitHub counts a skipped
  # required check as satisfied, and a red run becomes mergeable -- the exact
  # failure this job exists to prevent.
  #
  # `docker` is allowed to be skipped, and it alone: it is `if`-gated on the
  # suite selection being non-empty, so a change impacting no container suite
  # legitimately runs none. That indulgence cannot hide a broken selection,
  # because a `docker-select` failure is read here on its own account.
  gate:
    name: gate
    # Mergeability: pull requests, and the pushes to `main` that follow them.
    # The scheduled lanes report through their own jobs and gate nothing.
    if: always() && github.event_name != 'schedule'
    needs:
      - ci
      - coverage
      - supply-chain
      - docs
      - proofs
      - docker-select
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every dependency to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"${NEEDS}" | sort
          unmet="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | select((.key == "docker" and .value.result == "skipped") | not)
              | "  \(.key): \(.value.result)"
            ' <<<"${NEEDS}"
          )"
          if [ -n "${unmet}" ]; then
            printf 'Gate failed. These jobs did not succeed:\n%s\n' "${unmet}" >&2
            exit 1
          fi
          echo 'Gate passed: every job that gates a merge succeeded.'
