name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the full container run.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write

# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Format, lint, build, render rustdoc and gate the tests coverage cannot run,
  # in one Bazel output tree.
  #
  # Coverage is a sibling job rather than a step here. Both configurations build
  # the same ~140 broker integration tests as separate statically linked
  # binaries, and Bazel writes every one of them to `bazel-out` *and* to the
  # disk cache -- so running them on one runner put roughly 300 such binaries on
  # a 145 GB disk and filled it, which surfaced as a linker `Bus error` partway
  # through coverage. On two runners each configuration gets its own disk.
  #
  # `coverage`'s `--test_tag_filters=-docker,-timing-sensitive` (`.bazelrc`)
  # skips seven suites whose wall-clock assertions the profiling instrumentation
  # trips, and `bazel coverage //crates/...` never reaches
  # `//packaging:image_binaries_test`, which lives outside `//crates`. The
  # `test` step below is what actually executes those eight targets on every
  # pull request; nothing else in this workflow does.
  ci:
    name: build · lint · format · test · docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0

      - uses: ./.github/actions/reclaim-disk

      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format

      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI.
      - name: lint
        run: aspect lint --bazel-flag=--config=rbe

      # No `--config=rbe`: this compiles, and rustc codegen actions cannot
      # currently execute on the remote. See the `build:rbe` block in .bazelrc.
      # EXPERIMENT, not for merge as-is. Two flags added to answer one
      # question: does every rustc codegen action survive execution on a
      # BuildBuddy executor?
      #
      # `--noremote_accept_cached` is the whole experiment. Without it these
      # actions are served from the cache `main` populated and the step passes
      # having executed nothing -- which is exactly what invalidated two
      # diagnostic runs during #448. With it, the full closure genuinely
      # compiles on executors, `ring` included.
      #
      # If this step fails on `embeds the absolute working directory`, the
      # rules_rs scan breaks remote codegen for real, CI cannot become one
      # invocation, and both this and the `.bazelrc` change revert.
      - name: build
        run: |
          aspect build \
            --bazel-flag=--config=rbe \
            --bazel-flag=--noremote_accept_cached \
            --bazel-flag=--build_tag_filters=-docker \
            //...

      # The seven suites `coverage` excludes as timing-sensitive, plus
      # `//packaging:image_binaries_test`, which sits outside `//crates` and so
      # is never reached by `bazel coverage //crates/...` either. Narrowed to
      # just those rather than a full `bazel test //...`, which would rerun the
      # ~140 suites `coverage` already executes and roughly double this job's
      # wall clock for no new signal.
      # No `--config=rbe`, and this step is why the config is applied per step
      # rather than per job: `timing-sensitive` is exactly the tag for suites
      # that assert on wall clock, and `cpu:4` -- which stops Bazel starving
      # them locally -- means nothing to a remote executor, which sizes actions
      # from `exec_properties`. //crates/raft records `kraft_engine_sim` failing
      # 7 of 7 at twelve concurrent runs and passing at six.
      - name: test
        run: |
          bazel test --test_tag_filters=timing-sensitive //crates/...
          bazel test //packaging/...

      # `aspect build` renders docs for impacted crates. Build the complete set
      # here for the artifact, reusing this runner's Bazel output tree.
      - name: docgen
        run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

      # Impact analysis may omit a model when its source did not change. Run
      # every Stateright-bearing target explicitly so the verification catalog
      # remains a merge gate on every pull request.
      # Local as well. These are model checks rather than wall-clock
      # assertions, so they could run remotely, but they are the verification
      # catalog's merge gate and there is no case for making a gate depend on a
      # second service before the cheaper steps have proved it.
      - name: stateright models
        run: |
          bazel test \
            //crates/audit:audit_test \
            //crates/broker:broker_test \
            //crates/log:log_test \
            //crates/raft:kraft_model_test \
            //crates/throttle:bucket_model_test

  # Build and execute the tests with LLVM instrumentation, and upload the merged
  # LCOV report.
  #
  # `--build_tests_only` (set on the `coverage` command in `.bazelrc`) is what
  # keeps this to the tests it actually runs. `//crates/...` reaches the 22
  # `*_docker_test` wrappers, each of which links its suite a second time as a
  # `*_docker_bin`, and `--test_tag_filters` alone excludes a test from the run
  # but still builds it. Those 22 plus the 5 timing-sensitive suites are 27
  # instrumented broker binaries this job would otherwise link and discard.
  #
  # This job used to carry `disk-cache: false`, alone among the Bazel jobs, and
  # the reason is worth keeping because it is what the remote cache fixes. The
  # disk cache was this job's largest consumer by a wide margin: on run
  # 33567157672 `~/.cache/bazel-disk` held 61 GB next to a 19 GB output tree and
  # the job ended with 33 GB free on a 145 GB disk. None of those writes had a
  # reader -- the `ci` job never looks up an instrumented action, and the key
  # hashes `MODULE.bazel` and every `BUILD.bazel`, so the next coverage run
  # asked for a different one. Nor did they stay on the runner: setup-aspect's
  # post step saves on a miss, so run 33569559769 saved a 22 GB instrumented
  # tree under the `ci` namespace that two other jobs then restored and could
  # not use. That is the growth #337 measured. Turning the cache off was the
  # only lever Bazel 9 offered, because `--noremote_upload_local_results` and
  # the `no-remote-cache` tags are defined against remote caches and leave
  # `--disk_cache` writable. The price was the third-party closure, compiled
  # rather than restored: about 17 minutes rather than about 7.5.
  #
  # A remote cache has neither problem. Instrumented actions key under their own
  # digests on the server, so they cost this runner no disk at all and cannot
  # collide with the uninstrumented namespace; there is nothing to evict, and
  # nothing to save on the way out. The `disk-cache` inputs are gone from every
  # job for the same reason -- they shared one 10 GB repository-wide GitHub
  # Actions quota across seven namespaces, which is why an "exact cache hit on
  # restore" still executed 2520 actions on run 33693850747's container jobs.
  # `bazelisk-cache` and `repository-cache` stay: they hold fetched archives
  # rather than build outputs, and they are small.
  #
  # On a pull request this job is gated on the change touching Rust or build
  # inputs: `aspect changed-scope`, read through `select`, says so, and a
  # docs-only pull request cannot move a coverage number. The gate is PR-only
  # on purpose. A push to `main` always runs it, for two reasons: Codecov's
  # trend line for the default branch would otherwise have holes wherever a
  # docs-only commit landed, and `delivery` needs `[ci, coverage,
  # supply-chain]`, which a skipped `coverage` on `main` would never satisfy.
  # `changed-scope` fails open to `rust=true`, so an unreadable diff runs it.
  coverage:
    name: coverage
    needs: select
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.select.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # No `fetch-depth: 0`: nothing here reads the merge base -- the report
      # covers every target under //crates/..., not the impacted ones.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/reclaim-disk

      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      - name: coverage
        run: bazel coverage //crates/...

      # `if: always()`, and the three directories by name: when this job does
      # run the disk out, the failure arrives as a linker `Bus error` or a bare
      # `No space left on device` that names no consumer. This says which of the
      # output tree, the repository cache and the disk cache took the space --
      # together they are the job's whole footprint. `bazel-disk` stays on the
      # list although this job no longer configures one, because a line
      # reappearing there is the signal that it has come back.
      - name: disk usage after coverage
        if: always()
        run: |
          df -h /
          du -sh ~/.cache/bazel ~/.cache/bazel-repo ~/.cache/bazel-disk 2>/dev/null || true

      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: true

  supply-chain:
    name: cargo deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # The repository's cheap checks, in one job.
  #
  # These were four jobs -- `axl tasks`, `changelogs`, `creusot mutants::skip`
  # and `docs checks`. Every one of them wanted the same runner: a plain
  # checkout and the Aspect CLI, with no Bazel cache namespace and nothing to
  # build. Each then spent about 0.6 minutes on `setup-aspect` to do a few
  # seconds of work, and four of those slots came out of the 20-concurrent-job
  # cap that the container matrix is queued behind. Running the checks in
  # sequence here costs seconds and hands three slots back.
  #
  # None of them uses Bazel, so they still do not need the merge base or a
  # cache namespace: one `actions/checkout@v7` and one CLI is the union of what
  # the four asked for.
  checks:
    name: checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The longest of the four (`docs checks`, whose lychee step walks every
    # markdown file); the other three wanted 10.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # Every check and generator this repository runs on a runner is an AXL task
      # under `.aspect/`, and this step is their unit tests. It is also where the
      # "check the check" steps that used to sit beside three of them now live:
      # `aspect axl-tests` runs every suite, so a check and its tests no longer have
      # to be invoked as a pair from the step that uses the check.
      - name: the tasks' own tests
        run: aspect axl-tests
      # `aspect check-scripts` is the ratchet beside them. A new `.sh` or `.py`
      # fails it unless a row in that task's allowlist says where the file runs and
      # why a task cannot go there.
      - name: no new shell or Python script
        run: aspect check-scripts

      # Krabka tags and releases the whole workspace as one unit, so the root
      # CHANGELOG.md is the only record of what shipped. The twelve crate
      # changelogs this repository inherited said otherwise: they documented
      # robot-head/crabka's releases under these crate names. This keeps a version
      # heading from coming back into one.
      - name: no crate changelog records a release
        run: aspect check-crate-changelogs

      # cargo-mutants generates mutants syntactically and does not evaluate
      # #[cfg], so every #[cfg(creusot)] fn in crates/verified/src/ is mutated
      # anyway and reported as a survivor unless its own definition carries
      # `#[cfg_attr(test, mutants::skip)]`. This keeps that pairing from silently
      # dropping off a function as crates/verified grows.
      - name: every #[cfg(creusot)] fn skips mutation testing
        run: aspect check-creusot-skip

      # Documentation source checks do not use Bazel, so they stay off the
      # critical path while the `ci` job renders and uploads rustdoc from its
      # warm output tree.
      - name: generated KIP matrix
        run: |
          generated="$(mktemp)"
          trap 'rm -f "${generated}"' EXIT
          aspect generate-kip-matrix --output "${generated}"
          diff -u docs/KIP_MATRIX.md "${generated}"
      # docs/config-reference.md is rendered from docs/config-schema.json; a schema change without a regeneration fails here (the schema itself is compared against FileConfig by //crates/broker:config_reference_test).
      - name: generated config reference
        run: |
          generated="$(mktemp)"
          trap 'rm -f "${generated}"' EXIT
          aspect generate-config-reference --output "${generated}"
          diff -u docs/config-reference.md "${generated}"
      # Every docs/KFCs/KFC-*.md carries the README's seven headings in order and a Status that matches the README index; the `the tasks' own tests` step above runs the unit tests that prove the check fails on a missing heading or a status mismatch.
      - name: KFC template
        run: aspect check-kfcs
      # Design-doc index, required headings, README links, and #fragment anchors (lychee below does not follow fragments).
      - name: design docs
        run: aspect check-design-docs
      # Every series the reference dashboard and the alert rules name must be one the broker exports; the metrics_contract suite keeps the body file fresh.
      - name: metrics contract
        run: aspect check-metrics-contract
      # An exclude_re entry pinned to a path that a refactor moved or renamed stops matching anything, and the mutant it used to suppress comes back as an unexplained survivor.
      - name: mutants config
        run: aspect check-mutants-config
      # Every crate has a README and the root README crate table names it.
      - name: crate READMEs
        run: aspect check-crate-readmes
      - name: markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}" './**/*.md'

  # Re-discharge the Creusot proof sessions under `verif/`.
  #
  # The sessions are checked in, and nothing re-ran them before this job, so a
  # contract change could invalidate a proof and leave the stale session in the
  # tree with no signal. This proves them again on every change.
  #
  # It gates on the proof RESULT and never on the artifacts. A `.coma` file
  # embeds the absolute source path of the machine that wrote it, so a checkout
  # at any other path always differs and a `git diff --exit-code` over `verif/`
  # would fail every run for a reason that says nothing about the proofs.
  #
  # `cargo creusot` runs per crate. Running it bare builds the whole workspace,
  # including crates with no proof contracts, so discover the relevant members.
  proofs:
    name: creusot proofs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # setup-aspect's log and BEP uploads, as in every other Bazel job.
      id-token: write
      # Publishing the proof image, on the runs that build one.
      packages: write
    env:
      # What the proof step runs, and what `image_load` writes locally.
      LOCAL_IMAGE: docker.io/krabka-io/creusot:0.13.0
      # Must match `image_push`'s registry and repository in //tools/creusot.
      REGISTRY_IMAGE: ghcr.io/krabka-io/creusot
    steps:
      - uses: actions/checkout@v7

      # The CLI alone, and unconditionally: the tag below is what decides
      # whether this job builds anything, so it has to be resolved before the
      # cache-warming setup further down knows whether it is wanted. The Bazel
      # caches stay on that second step, on the path that actually runs Bazel.
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # The proved-package list and what the proof image actually proves cannot
      # drift apart. This ran inside the image until the checks moved to AXL
      # tasks; the image has no Aspect CLI, so it runs here, before the image
      # does anything.
      - name: the proofs job covers every Creusot package
        run: aspect check-creusot-packages

      # A digest of everything that decides the image's contents. See
      # //tools/creusot for why the registry, and not the Bazel disk cache, is
      # what keeps CI from reinstalling Creusot on every run.
      - id: image
        name: resolve the proof image tag
        run: echo "tag=$(aspect creusot-image-tag)" >>"${GITHUB_OUTPUT}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A miss is a normal outcome, not a failure: the tag is new, or this is a
      # fork whose token cannot read the package. Either way the job falls
      # through to building the image, which is what it always used to do.
      - id: cached
        name: reuse the published proof image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          if docker pull "${IMAGE}"; then
            docker tag "${IMAGE}" "${LOCAL_IMAGE}"
            echo "hit=true" >>"${GITHUB_OUTPUT}"
          else
            echo "hit=false" >>"${GITHUB_OUTPUT}"
          fi

      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        if: steps.cached.outputs.hit != 'true'
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # `--verbose_failures`: the toolchain layer is built by a genrule that
      # shells out to Docker, and when it fails Bazel otherwise reports only
      # "Target //tools/creusot:image_load failed to build" with no command and
      # no output. The flag is what makes that action's failure diagnosable
      # from the log alone.
      - name: build the pinned proof image
        if: steps.cached.outputs.hit != 'true'
        run: bazel run --verbose_failures //tools/creusot:image_load

      # Before the proofs, not after: the image is valid whether or not the
      # proofs it runs pass, and publishing it here means a failing run's retry
      # already has it. A fork's token is read-only, so it keeps its build.
      - name: publish the proof image
        if: steps.cached.outputs.hit != 'true' && github.event.pull_request.head.repo.fork != true
        run: bazel run //tools/creusot:push -- --tag "${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}

      # The runner supplies only the Docker kernel boundary and the checkout.
      # Rust, OCaml, opam, Why3, the provers, Python and native libraries all
      # come from the apko/rules_img image.
      - name: prove
        run: |
          docker run --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/workspace \
            "${LOCAL_IMAGE}"

  # Container suites, sharded across runners.
  #
  # These saturate a runner: the suites are container-heavy, so Bazel got only
  # about 1.2x concurrency running them together and the box, not the target
  # granularity, was the limit. Sharding them across runners is what actually
  # parallelises them -- one job per group of suites, so the wall clock is the
  # slowest group rather than the sum of all of them.
  #
  # `aspect test` does not narrow to impacted targets -- that is an Aspect
  # Workflows feature, not part of the open-source CLI. The custom `aspect
  # container-suites` task owns the selection: scheduled/manual runs take every
  # suite, while PRs use Bazel rdeps outside the broker and an explicit broker
  # feature map so one Rust target does not become the entire JVM matrix.
  #
  # A matrix entry is a GROUP of targets rather than a single one, and the task
  # emits at most 12 of them. The cap is the concurrency budget: GitHub runs at
  # most 20 jobs at once for this account, and the rest of the workflow already
  # claims several, so a matrix wider than that queues into a second wave and
  # the run's wall clock becomes two container jobs deep instead of one. Twelve
  # entries fit alongside the other jobs in a single wave. Grouping is also
  # cheaper per target: the suites in a group are tested by one Bazel
  # invocation, which analyses and compiles the shared broker closure once
  # rather than once per suite.
  #
  # This job also answers whether the change touches Rust or build inputs at
  # all, which is what lets `coverage` sit out a docs-only pull request.
  select:
    name: select
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      any: ${{ steps.select.outputs.any }}
      rust: ${{ steps.scope.outputs.rust }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # rdeps needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      - id: select
        run: |
          set -euo pipefail
          if [ "${FULL_MATRIX}" = "true" ]; then
            aspect container-suites
          else
            aspect container-suites --base "${BASE_SHA}"
          fi

      # A second reading of the same diff, on the same checkout, so this costs
      # a job slot nothing. `--base` is omitted on the full-matrix runs for the
      # same reason `container-suites` omits it: with no merge base to compare
      # against there is no diff to narrow by, and `changed-scope` fails open to
      # `rust=true` -- which is what a scheduled or dispatched run wants anyway.
      - id: scope
        run: |
          set -euo pipefail
          if [ "${FULL_MATRIX}" = "true" ]; then
            aspect changed-scope
          else
            aspect changed-scope --base "${BASE_SHA}"
          fi

  docker:
    name: container · ${{ matrix.suite.name }}
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One group failing should not cancel the rest -- the point of the shard
      # is to see every suite's result in one run.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # The host side of these suites reaches the broker over loopback, but a few
      # host-side Rust clients bootstrap through the advertised name, so it has to
      # resolve here too. Containers resolve it separately, through
      # `--add-host=host.docker.internal:host-gateway`.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      # `aspect container-suites` selects by touched path, so a group can name a
      # container target that is not a test rule -- the KDC fixture's `image`
      # and `seed_layer` are built, not run. `bazel test` exits 4 on a label
      # with no test targets ("No test targets were found, yet testing was
      # requested"), which failed every suite in the matrix regardless of the
      # code under review. Dispatch on the rule kind instead.
      #
      # One `bazel query` over the whole group, then at most one `bazel test`
      # and at most one `bazel build` -- never a command per target. Sharing an
      # invocation is the point of grouping: the group's suites analyse and
      # compile the broker closure once between them, where a loop paid for it
      # per target.
      #
      # `matrix.suite.targets` arrives through `env` rather than as a `${{ }}`
      # interpolation into the script body, so a label can never be read as
      # shell. It is a space-joined list, which `set(...)` takes verbatim.
      - env:
          TARGETS: ${{ matrix.suite.targets }}
        run: |
          set -euo pipefail
          # Assigned before the loop reads it: a command substitution in a
          # here-string word is not a simple command, so `set -e` would not
          # abort on a failed query there and the group would pass having run
          # nothing.
          labels="$(bazel query --output=label_kind "set(${TARGETS})")"
          tests=""
          builds=""
          # `--output=label_kind` prints "<kind> <rule|file> <label>", so the
          # kind is the first word and the label the last.
          while read -r kind _ label; do
            [ -n "${label}" ] || continue
            case "${kind}" in
              *_test) tests="${tests} ${label}" ;;
              *) builds="${builds} ${label}" ;;
            esac
          done <<<"${labels}"
          if [ -z "${tests}" ] && [ -z "${builds}" ]; then
            printf 'No labels resolved for group targets: %s\n' "${TARGETS}" >&2
            exit 1
          fi
          # `--config=docker-rbe` is defined for `test` only (it swaps the
          # `--test_tag_filters` set), so passing it to `build` fails with
          # "Config value 'docker-rbe' is not defined in any .rc file".
          #
          # It runs the suites on BuildBuddy Firecracker microVMs, each with its
          # own dockerd, rather than on this runner's daemon. The compile stays
          # here -- see the `docker-rbe` block in `.bazelrc`.
          if [ -n "${tests}" ]; then
            bazel test --config=docker-rbe ${tests}
          fi
          if [ -n "${builds}" ]; then
            bazel build ${builds}
          fi

  # The KDC fixture writes fresh keytabs through a bind mount. Keep the two
  # Kerberos acceptance cases visible in their own scheduled lane instead of
  # leaving them permanently #[ignore]d.
  gssapi:
    name: container · gssapi
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: load KDC image
        run: bazel run //crates/broker/tests/fixtures/security/kdc:image_load
      - name: run GSSAPI acceptance suites
        env:
          KRB5_CONFIG: ${{ github.workspace }}/crates/broker/tests/fixtures/security/kdc/krb5.conf
          RUST_LOG: warn
          SSPI_KDC_URL: tcp://localhost:88
        run: |
          set -euo pipefail
          fixture=crates/broker/tests/fixtures/security/kdc/docker-compose.yml
          trap 'docker compose -f "${fixture}" down' EXIT
          docker compose -f "${fixture}" up -d
          timeout 60 sh -c 'until docker compose -f "$1" logs kdc | grep -q KDC_READY; do sleep 1; done' _ "${fixture}"
          cargo test -p krabka-broker --test gssapi_e2e --test auth_handlers gssapi -- --ignored --test-threads=1

  # Push the broker image.
  #
  # Not `aspect delivery`: its "only what changed" tracking needs
  # `ASPECT_WORKFLOWS_DELIVERY_API_ENDPOINT`, a state backend that comes with
  # Aspect Workflows rather than the open-source CLI. Without it the task refuses
  # to run except with `--mode=always`, which is what a plain push already is.
  #
  # Pushing unconditionally costs less than it sounds: the image is
  # content-addressed, so a registry that already holds these layers takes the
  # manifest and skips the blobs. Revisit if Workflows is ever adopted.
  delivery:
    name: delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, coverage, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        run: bazel run //packaging:push -- --tag "${GITHUB_SHA}"

  # The single context `main` requires, and the reason the list of required
  # checks is one name rather than one name per job.
  #
  # Branch protection can only name checks statically, and `docker` is a matrix
  # built from the impacted-suite query, so its jobs are named at run time and
  # can never appear in that list. Before this job the protected set was `build
  # · test · lint · format`, `coverage` and `docgen`: `cargo deny`, the Creusot
  # proofs and every container suite could go red without blocking a merge.
  # This job depends on all of them, so protection needs only this one name and
  # a job added below is covered by adding it to `needs`.
  #
  # `always()` is what makes this a gate rather than a rubber stamp. Without it
  # a failed dependency leaves this job skipped, GitHub counts a skipped
  # required check as satisfied, and a red run becomes mergeable -- the exact
  # failure this job exists to prevent.
  #
  # Two dependencies are allowed to be skipped, and only those two. `docker` is
  # `if`-gated on the suite selection being non-empty, so a change impacting no
  # container suite legitimately runs none. `coverage` is `if`-gated on the
  # pull request touching Rust or build inputs, so a docs-only pull request
  # legitimately runs none either -- and only a pull request can skip it, since
  # a push to `main` runs coverage unconditionally. Neither indulgence can hide
  # a broken selection, because a `select` failure is read here on its own
  # account.
  gate:
    name: gate
    # Mergeability: pull requests, and the pushes to `main` that follow them.
    # The scheduled lanes report through their own jobs and gate nothing.
    if: always() && github.event_name != 'schedule'
    needs:
      - ci
      - coverage
      - supply-chain
      - checks
      - proofs
      - select
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every dependency to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"${NEEDS}" | sort
          unmet="$(
            jq -r '
              ["coverage", "docker"] as $may_skip
              | to_entries[]
              | . as $dep
              | select($dep.value.result != "success")
              | select(($dep.value.result == "skipped" and ($may_skip | index($dep.key)) != null) | not)
              | "  \($dep.key): \($dep.value.result)"
            ' <<<"${NEEDS}"
          )"
          if [ -n "${unmet}" ]; then
            printf 'Gate failed. These jobs did not succeed:\n%s\n' "${unmet}" >&2
            exit 1
          fi
          echo 'Gate passed: every job that gates a merge succeeded.'
