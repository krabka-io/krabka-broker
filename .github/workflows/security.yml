name: security
on:
  workflow_call:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec and reviewed reachability
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # 2026.45
      # The runner's rustup installs the channel `rust-toolchain.toml` pins on
      # first use, so neither step needs a toolchain action.
      - name: Check the reviewed RSA dependency boundary
        run: aspect check-rustsec-2023-0071
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Reject unsuppressed RustSec advisories
        run: cargo audit --ignore RUSTSEC-2023-0071
