name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec and reviewed reachability
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4305ac05e8f3e0c995e89e18cfc09d19f28d336f # stable
      - name: Check the reviewed RSA dependency boundary
        run: tools/security/check-rustsec-2023-0071.sh
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0
      - name: Reject unsuppressed RustSec advisories
        run: cargo audit --ignore RUSTSEC-2023-0071
