name: released Kafka 4.4 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect immutable released oracle evidence (not candidate qualification)
        run: python3 tools/kafka44/collect.py --revision "${GITHUB_SHA}" --output evidence/kafka44
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kafka44-oracle-evidence
          path: evidence/kafka44
          if-no-files-found: error
          retention-days: 30
