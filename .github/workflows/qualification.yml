name: cloud performance harness smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: gcp-ubuntu-24-04-32core
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 402edff35a0ce3832ea59caca134172f1c13de8b
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87
        with:
          disk-cache: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
        with:
          install_only: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17
      - name: Exercise the existing smoke contract on the baseline source
        run: |
          set -euo pipefail
          if test "$(cat /proc/sys/fs/inotify/max_user_instances)" -lt 512; then
            sudo sysctl -w fs.inotify.max_user_instances=512
          fi
          mkdir -p "$RUNNER_TEMP/performance-tmp"
          export TMPDIR="$RUNNER_TEMP/performance-tmp"
          PERF_ARTIFACT_DIR="$RUNNER_TEMP/performance-smoke" packaging/performance/qualify.sh smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloud-performance-smoke
          path: ${{ runner.temp }}/performance-smoke/
          retention-days: 90
          if-no-files-found: error
