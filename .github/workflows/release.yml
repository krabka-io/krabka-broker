name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/krabka-io/krabka-broker
  CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # A `v*` tag is a name a person pushes, and before this job the workflow
  # believed it. Nothing checked that the commit under the tag was on `main`,
  # that `main`'s own gate had passed on it, or that the tree it names says the
  # version the tag does -- so a tag pushed from a feature branch, or from a
  # `main` commit whose `gate` went red, published a signed, SBOM-attested
  # image with SLSA provenance. A cosign signature says who built an image and
  # never that the image was tested; these three checks are what stand behind
  # it.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # `gh run list` below reads this repository's workflow runs.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because both the ancestry check below and the
          # `latest` rule in `release` need refs this checkout would otherwise
          # not fetch.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}

      # `fetch-depth: 0` fetches the history, and the remote-tracking ref this
      # asks about is the one thing it is not guaranteed to leave behind on a
      # tag checkout. Fetching `main` explicitly is what makes `origin/main`
      # mean the branch and not whatever the checkout happened to write.
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} names ${GITHUB_SHA}, which is not an ancestor of origin/main." >&2
            echo 'A release is cut from a commit that merged into main, never from a branch.' >&2
            exit 1
          fi

      # The same check `ci.yml` runs on every push, given the tag as the
      # version every pin must name -- so a `v0.6.0` tag over a tree that still
      # says 0.5.4 everywhere fails here rather than stamping 0.5.4 into every
      # purl of the SBOM this workflow signs.
      - name: the version pins name the tag
        run: aspect check-version-pins --expected "${GITHUB_REF_NAME}"

      # `gate` is the single required context on `main`, and it depends on
      # every job that gates a merge -- so a successful `push` run of `ci.yml`
      # for this commit is exactly the statement "this commit was tested".
      # A `pull_request` run is not: it tested the merge of the pull request
      # into `main`, which is a different tree.
      - name: main CI succeeded for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs="$(gh run list --workflow ci.yml --commit "${GITHUB_SHA}" \
            --limit 100 --json conclusion,event,url)"
          jq -r '.[] | "\(.conclusion)\t\(.event)\t\(.url)"' <<<"${runs}"
          passed="$(jq '[.[] | select(.event == "push" and .conclusion == "success")] | length' <<<"${runs}")"
          if [ "${passed}" -eq 0 ]; then
            echo "No successful push run of ci.yml for ${GITHUB_SHA}." >&2
            echo 'Only a commit whose main CI run went green is releasable.' >&2
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: validate dependency policy and build SBOM
        run: |
          cargo deny --manifest-path crates/broker/Cargo.toml \
            --target x86_64-unknown-linux-gnu --exclude-dev check
          aspect sbom --output sbom.cdx.json

      # Promotion over rebuild. `ci.yml`'s `delivery` job already pushed this
      # exact commit as `${IMAGE}:${GITHUB_SHA}`, and `verify` above has
      # established that the run which did so was green. Signing those bytes
      # rather than a second build of them is what makes the signed digest the
      # digest that was tested, instead of a rebuild that merely came from the
      # same source.
      - name: resolve the delivery image
        id: delivery
        run: |
          digest=""
          if inspected="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" 2>&1)"; then
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${inspected}")"
          else
            echo "${inspected}"
          fi
          if [ "${digest#sha256:}" = "${digest}" ]; then
            echo "No delivery image at ${IMAGE}:${GITHUB_SHA}; the release will rebuild it."
            digest=""
          fi
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      # The fallback, for a tag whose commit predates `delivery` or whose
      # delivery tag has been reaped from the registry. It builds from the same
      # Bazel graph the delivery push builds from.
      - name: push release candidate
        if: steps.delivery.outputs.digest == ''
        run: bazel run //packaging:push -- --tag "${CANDIDATE_TAG}"

      - name: resolve image digest
        id: image
        env:
          DELIVERY_DIGEST: ${{ steps.delivery.outputs.digest }}
        run: |
          if [ -n "${DELIVERY_DIGEST}" ]; then
            digest="${DELIVERY_DIGEST}"
            source="promoted from ${IMAGE}:${GITHUB_SHA}"
          else
            digest="$(docker buildx imagetools inspect "${IMAGE}:${CANDIDATE_TAG}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            source="rebuilt as ${IMAGE}:${CANDIDATE_TAG}"
          fi
          test "${digest#sha256:}" != "${digest}"
          echo "Releasing ${digest}, ${source}."
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          echo "source=${source}" >>"${GITHUB_OUTPUT}"

      - name: create provenance predicate
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE: ${{ steps.image.outputs.source }}
        run: |
          jq -n \
            --arg commit "${GITHUB_SHA}" \
            --arg digest "${DIGEST}" \
            --arg ref "${GITHUB_REF}" \
            --arg source "${SOURCE}" \
            --arg run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" '
            {
              buildDefinition: {
                buildType: "https://github.com/krabka-io/krabka-broker/.github/workflows/release.yml@v1",
                externalParameters: {ref: $ref},
                internalParameters: {
                  bazelTarget: "//packaging:image",
                  imageSource: $source
                },
                resolvedDependencies: [{
                  uri: "git+https://github.com/krabka-io/krabka-broker",
                  digest: {gitCommit: $commit}
                }]
              },
              runDetails: {
                builder: {id: $run},
                metadata: {invocationId: $run}
              },
              outputDigest: $digest
            }
          ' >provenance.json

      - name: sign image and attest SBOM and provenance
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          cosign sign --yes "${reference}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${reference}"
          cosign attest --yes --type slsaprovenance --predicate provenance.json "${reference}"

      - name: verify release signatures
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${reference}"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${reference}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${reference}"

      - name: publish release tags
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # `fetch-tags` defaults off on `actions/checkout`, so ask for the
          # tags explicitly rather than relying on what the tag checkout left.
          git fetch --tags --force origin

          # `latest` means the newest release, and a patch cut after a later
          # minor is not that: without this, a v0.5.4 tagged after v0.6.0 moved
          # `latest` backwards onto it. `sort -V` orders the tags the way a
          # version is read rather than the way a string is.
          newest="$(git tag --list 'v*' | sort -V | tail -1)"
          tags=("${GITHUB_REF_NAME}")
          if [ "${newest}" = "${GITHUB_REF_NAME}" ]; then
            tags+=(latest)
          else
            echo "::notice::${GITHUB_REF_NAME} is not the newest v* tag (${newest}); leaving :latest where it is"
          fi

          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create --prefer-index=false \
            "${arguments[@]}" "${IMAGE}@${DIGEST}"

          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "${IMAGE}:${tag}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            test "${actual}" = "${DIGEST}"
          done

      - name: publish GitHub release and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json --clobber
