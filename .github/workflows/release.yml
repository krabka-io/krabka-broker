name: release

on:
  push:
    tags: ["v*"]
  # Releases a tag that is already pushed, with this workflow as it is on the
  # dispatching branch rather than as it was at the tag. It is for a tag whose
  # own `release` run failed in the workflow and not in the commit: never move
  # or delete a pushed tag, and a commit that is fine does not need a new
  # patch version. The run checks out the tag and holds it to the same
  # `verify` checks as a push.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v* tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/krabka-io/krabka-broker

jobs:
  # A `v*` tag is a name a person pushes, and before this job the workflow
  # believed it. Nothing checked that the commit under the tag was on `main`,
  # that `main`'s own gate had passed on it, or that the tree it names says the
  # version the tag does -- so a tag pushed from a feature branch, or from a
  # `main` commit whose `gate` went red, published a signed, SBOM-attested
  # image with SLSA provenance. A cosign signature says who built an image and
  # never that the image was tested; these three checks are what stand behind
  # it.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      delivery_run: ${{ steps.main-ci.outputs.delivery_run }}
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    permissions:
      contents: read
      # `gh run list` below reads this repository's workflow runs.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push checks out the tag it was started by; a dispatch, the tag
          # it names.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # The whole history, because both the ancestry check below and the
          # `latest` rule in `release` need refs this checkout would otherwise
          # not fetch.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3

      # Everything below names the release by this tag and commit, never by
      # `GITHUB_REF_NAME` and `GITHUB_SHA`: on a dispatch those are the branch
      # the workflow was started from.
      - name: resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "${tag}" in
            v[0-9]*) ;;
            *)
              echo "${tag} is not a v* release tag." >&2
              exit 1
              ;;
          esac
          commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          test "$(git rev-parse HEAD)" = "${commit}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"

      # `fetch-depth: 0` fetches the history, and the remote-tracking ref this
      # asks about is the one thing it is not guaranteed to leave behind on a
      # tag checkout. Fetching `main` explicitly is what makes `origin/main`
      # mean the branch and not whatever the checkout happened to write.
      - name: the tagged commit is on main
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main; then
            echo "${RELEASE_TAG} names ${RELEASE_COMMIT}, which is not an ancestor of origin/main." >&2
            echo 'A release is cut from a commit that merged into main, never from a branch.' >&2
            exit 1
          fi

      # The same check `ci.yml` runs on every push, given the tag as the
      # version every pin must name -- so a `v0.6.0` tag over a tree that still
      # says 0.5.4 everywhere fails here rather than stamping 0.5.4 into every
      # purl of the SBOM this workflow signs.
      - name: the version pins name the tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: aspect check-version-pins --expected "${RELEASE_TAG}"

      # `gate` is the single required context on `main`, and it depends on
      # every job that gates a merge -- so a successful `push` run of `ci.yml`
      # for this commit is exactly the statement "this commit was tested".
      # A `pull_request` run is not: it tested the merge of the pull request
      # into `main`, which is a different tree.
      - name: main CI succeeded for this commit
        id: main-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          runs="$(gh run list --workflow ci.yml --commit "${RELEASE_COMMIT}" \
            --branch main --limit 100 --json conclusion,event,url,databaseId)"
          jq -r '.[] | "\(.conclusion)\t\(.event)\t\(.url)"' <<<"${runs}"
          passed="$(jq '[.[] | select(.event == "push" and .conclusion == "success")] | length' <<<"${runs}")"
          if [ "${passed}" -eq 0 ]; then
            echo "No successful push run of ci.yml for ${RELEASE_COMMIT}." >&2
            echo 'Only a commit whose main CI run went green is releasable.' >&2
            exit 1
          fi
          delivery_run="$(jq -r '[.[] | select(.event == "push" and .conclusion == "success")][0].databaseId' <<<"${runs}")"
          echo "delivery_run=${delivery_run}" >>"${GITHUB_OUTPUT}"

  release:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: validate dependency policy and build SBOM
        run: |
          cargo deny --manifest-path Cargo.toml \
            --target x86_64-unknown-linux-gnu --exclude-dev check
          aspect sbom --output sbom.cdx.json

      # Bind promotion to the digest recorded by the successful main push run.
      # A commit tag alone is mutable, and a rebuild is not delivery's image.
      - name: resolve the tested delivery image
        id: delivery-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_RUN: ${{ needs.verify.outputs.delivery_run }}
        run: |
          gh run download "${DELIVERY_RUN}" --name delivery-image --dir delivery-image
          digest="$(aspect check-delivery-image \
            --expected delivery-image/delivery-image.digest \
            --image "${IMAGE}:${RELEASE_COMMIT}")"
          # Resolve the immutable reference as well, before signing anything.
          aspect check-delivery-image --expected delivery-image/delivery-image.digest \
            --image "${IMAGE}@${digest}"
          source="promoted from CI run ${DELIVERY_RUN}: ${IMAGE}@${digest}"
          echo "Releasing ${digest}, ${source}."
          echo "amd64_digest=${digest}" >>"${GITHUB_OUTPUT}"
          echo "source=${source}" >>"${GITHUB_OUTPUT}"

      # The ARM64 half is release-only. PR and main CI build and publish the
      # tested AMD64 delivery image; a v* tag builds the ARM64 manifest, pushes
      # it by digest alone, and records its digest the way `delivery` records
      # AMD64's.
      #
      # The AMD64 half is never rebuilt here. This job used to build both
      # halves through `image_index`'s platform split and require the AMD64
      # child to equal the tested digest. That transition moves every action
      # into another output directory, so nothing came from the remote cache
      # delivery had used: the job recompiled the broker from scratch and
      # passed only while such a rebuild was byte-for-byte identical to the
      # build delivery tested. v0.7.0's was. v1.0.0's was not, and the release
      # stopped there. The index below names the tested manifest by digest
      # instead, so the bytes it promotes are the bytes CI tested.
      - name: build and push the arm64 manifest
        id: arm64
        run: |
          flags=(-c opt --platforms=//:linux_arm64)
          bazel build "${flags[@]}" //packaging:image_manifest_blob
          manifest="$(bazel cquery "${flags[@]}" //packaging:image_manifest_blob --output=files)"
          jq -e '.layers | length > 0' "${manifest}" >/dev/null
          printf 'sha256:%s\n' "$(sha256sum "${manifest}" | cut -d ' ' -f 1)" >arm64-image.digest
          # No `--tag`: a digest-only push, so no tag ever names the ARM64
          # manifest on its own.
          bazel run "${flags[@]}" //packaging:push
          digest="$(aspect check-delivery-image --expected arm64-image.digest \
            --image "${IMAGE}@$(cat arm64-image.digest)")"
          echo "arm64_digest=${digest}" >>"${GITHUB_OUTPUT}"

      # `imagetools create` reads each child's platform from its config. The
      # dry run is the index it would push, checked before any tag moves; the
      # pushed index is read back and checked again before anything is signed.
      - name: publish release image index
        id: image
        env:
          AMD64_DIGEST: ${{ steps.delivery-image.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.arm64.outputs.arm64_digest }}
        run: |
          children() {
            jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)=\(.digest)"] | sort | join(" ")'
          }
          expected="linux/amd64=${AMD64_DIGEST} linux/arm64=${ARM64_DIGEST}"
          sources=("${IMAGE}@${AMD64_DIGEST}" "${IMAGE}@${ARM64_DIGEST}")

          planned="$(docker buildx imagetools create --dry-run "${sources[@]}" | children)"
          test "${planned}" = "${expected}"

          git fetch --tags --force origin
          newest="$(git tag --list 'v*' | sort -V | tail -1)"
          tags=("${RELEASE_TAG}")
          if [ "${newest}" = "${RELEASE_TAG}" ]; then
            tags+=(latest)
          else
            echo "::notice::${RELEASE_TAG} is not the newest v* tag (${newest}); leaving :latest where it is"
          fi

          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${arguments[@]}" "${sources[@]}"

          digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          pushed="$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | children)"
          test "${pushed}" = "${expected}"
          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
            test "${actual}" = "${digest}"
          done
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: create provenance predicate
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE: ${{ steps.delivery-image.outputs.source }}
          ARM64_DIGEST: ${{ steps.arm64.outputs.arm64_digest }}
        run: |
          jq -n \
            --arg commit "${RELEASE_COMMIT}" \
            --arg digest "${DIGEST}" \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg source "${SOURCE}" \
            --arg arm64 "${ARM64_DIGEST}" \
            --arg run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" '
            {
              buildDefinition: {
                buildType: "https://github.com/krabka-io/krabka-broker/.github/workflows/release.yml@v1",
                externalParameters: {ref: $ref},
                internalParameters: {
                  bazelTarget: "//packaging:image",
                  platforms: "//:linux_arm64",
                  compilationMode: "opt",
                  arm64Digest: $arm64,
                  imageSource: $source
                },
                resolvedDependencies: [{
                  uri: "git+https://github.com/krabka-io/krabka-broker",
                  digest: {gitCommit: $commit}
                }]
              },
              runDetails: {
                builder: {id: $run},
                metadata: {invocationId: $run}
              },
              outputDigest: $digest
            }
          ' >provenance.json

      - name: sign image and attest SBOM and provenance
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          cosign sign --yes "${reference}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${reference}"
          cosign attest --yes --type slsaprovenance --predicate provenance.json "${reference}"

      - name: verify release signatures
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${reference}"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${reference}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${reference}"

      - name: publish GitHub release and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 ||
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes
          gh release upload "${RELEASE_TAG}" sbom.cdx.json --clobber
