name: docs-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docs-pages.yml
      - .github/actions/**
      - docs/rustdoc-empty-implementors.tsv
      - .aspect/**
      - bazel/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - MODULE.aspect
      - MODULE.bazel
      - MODULE.bazel.lock
      - BUILD.bazel
      - .bazelrc
      - .bazelversion
      - rust-toolchain.toml

# Publish the rustdoc set to GitHub Pages.
#
# The `ci` workflow renders the same set on every run and uploads it as an
# artifact nobody browses. This renders it once more from `main`, adds a
# landing page that lists every crate, and deploys it, so the README can link
# to a page rather than to an artifact.
#
# It is its own workflow rather than a job in `ci.yml` because a deployment
# needs `pages: write` and its own concurrency group, and because a failed
# deploy should not turn the merge gate red.

permissions:
  contents: read
  # Both the Pages deployment and setup-aspect's log uploads need the OIDC
  # token, as in `ci.yml`.
  id-token: write

# One deployment at a time. A push that lands while one is in flight waits
# rather than cancelling it, so the site never ends between two versions.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pull requests verify the archive without production deployment permissions.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    name: render rustdoc
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/reclaim-disk

      - uses: aspect-build/setup-aspect@ccc445383a7d4cea499744d823a7698ae077a407 # 2026.45
        with:
          bazelisk-cache: true
          # Redundant beside the remote cache, and it is what consumed the
          # 10 GB repository-wide Actions quota. Off explicitly: omitting the
          # input leaves setup-aspect's default disk cache switched on.
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          # Everything that is not a pull request is a trusted context: pushes
          # to `main`, the nightly, a dispatch, a release tag. Pull requests
          # read only.
          upload: ${{ github.event_name != 'pull_request' }}

      # The same query `ci.yml`'s docgen step runs, so the two never disagree
      # about which crates have documentation.
      - name: docgen
        run: |
          set -euo pipefail
          targets="${RUNNER_TEMP}/rustdoc-targets.txt"
          bazel query 'kind("rust_doc rule", //crates/...)' > "${targets}"
          test -s "${targets}"
          bazel build --target_pattern_file="${targets}"

      - name: assemble the site
        run: aspect rustdoc-site --output site --repo krabka-broker --empty-implementors docs/rustdoc-empty-implementors.tsv

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Use only staging and archive verification. Cross-site checks are separate.
      - name: Checkout pinned packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krabka-io/tooling
          ref: fd30652ceeae95fa7ee8288aa105bce6f109904f
          path: .docs-packaging
          sparse-checkout: actions/upload-rustdoc-pages
          persist-credentials: false

      - name: Stage public docs and linked hidden source pages
        run: |
          set -euo pipefail
          staging_root="$(mktemp -d "${RUNNER_TEMP}/rustdoc-pages.XXXXXX")"
          python3 .docs-packaging/actions/upload-rustdoc-pages/pages_site.py stage site "${staging_root}/site"
          echo "DOCS_STAGED_PATH=${staging_root}/site" >> "${GITHUB_ENV}"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DOCS_STAGED_PATH }}
          # Only selected source pages can contain hidden path segments.
          include-hidden-files: true
          retention-days: 1

      - name: Verify final Pages archive
        run: python3 .docs-packaging/actions/upload-rustdoc-pages/pages_site.py verify "${DOCS_STAGED_PATH}" "${RUNNER_TEMP}/artifact.tar"

      # Check uploaded bytes. External destinations remain unchecked.
      - name: Verify final archive links and assets
        run: python3 .docs-packaging/actions/upload-rustdoc-pages/archive_links.py "${RUNNER_TEMP}/artifact.tar"

  deploy:
    # Only main may publish to production Pages.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
