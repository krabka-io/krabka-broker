name: rbe-diagnostic
# Throwaway. Not for merge.
#
# `codspeed` and `ring` fail rules_rs's working-directory scan when they
# execute on a BuildBuddy executor:
#
#     compiled Rust output ...libcodspeed-*.rlib embeds the absolute working
#     directory /buildbuddy-execroot
#
# Three hypotheses have been wrong -- per-crate, two-action (pinning
# `CargoBuildScriptRun` local did not help), and "no codegen works remotely"
# (`build` passed with 13 remote executions). Each cost a full CI run, because
# Bazel cannot fetch through the sandbox this was written in: `bazel build`
# there dies fetching bats-core with a proxy 403, which is an organization
# policy denial rather than anything configurable.
#
# So this reproduces the failure on the smallest possible target and asks for
# everything a failing build can still say. The question it exists to settle is
# whether the absolute path is *passed into* rustc -- a `-Lnative=` or an
# `--env-file` value the build script contributed -- or generated inside it,
# because the two have completely different fixes and no amount of reasoning
# from the outside has separated them.
#
# Delete this file once the answer is written down.

on:
  push:
    branches: [claude/ci-performance-options-p6gy11]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rbe-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: reproduce the execroot scan failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true

      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: "false"

      # `--noremote_accept_cached` is the flag that makes this a reproduction
      # at all, and both earlier runs lacked it. 33726077901 and 33726429927
      # each reported `1287 remote cache hit, 623 internal` here and completed
      # successfully: nothing executed remotely, so neither run ever triggered
      # the failure it exists to study, and the flags they compared came from
      # cache-hit printouts. Codex caught this on #448.
      #
      # `--verbose_failures` then prints the rustc command line the executor
      # ran, `--subcommands` prints it per action, `--announce_rc` proves which
      # flags were in force. `|| true` because the interesting steps follow.
      - name: compile codspeed remotely and keep going
        run: |
          bazel build --config=rbe \
            --verbose_failures \
            --subcommands=pretty_print \
            --announce_rc \
            --remote_download_outputs=all \
            --noremote_accept_cached \
            '@@rules_rs++crate+crates__codspeed-5.0.1//:codspeed' \
            2>&1 | tee "${RUNNER_TEMP}/remote.log" || true

      # The same target with no executor -- and, crucially, forced to actually
      # run. Run 33726077901 compared a remote *execution* against a local
      # *cache hit* (`1287 remote cache hit`, codspeed among them) and so
      # proved nothing about local execution. `--noremote_accept_cached` is
      # what makes this the comparison it was supposed to be: if the scan
      # fires here too then it is not remote execution that breaks it and
      # every explanation offered so far is wrong.
      - name: compile the same target locally, cache bypassed
        run: |
          bazel build \
            --verbose_failures \
            --subcommands=pretty_print \
            --noremote_accept_cached \
            --remote_download_outputs=all \
            '@@rules_rs++crate+crates__codspeed-5.0.1//:codspeed' \
            2>&1 | tee "${RUNNER_TEMP}/local.log" || true
          echo "::group::did it actually execute, or hit cache again"
          grep -E 'processes:|Build completed|Build did NOT' "${RUNNER_TEMP}/local.log" || true
          echo "::endgroup::"

      # Only the codspeed compile. Reading the whole phase log and then
      # `sort -u`-ing it, as the first version did, strips the action context:
      # a flag that shows up in one phase can belong to any crate in the
      # closure that happened to execute there, so an apparent remote/local
      # difference can be about an entirely different target. Codex flagged
      # this on #448 and it was right. `awk` cuts the one SUBCOMMAND block.
      - name: the codspeed compile command, in each phase
        run: |
          for phase in remote local; do
            echo "::group::${phase}: the codspeed subcommand block"
            awk '/SUBCOMMAND.*crates__codspeed/,/^# Runner:/' \
              "${RUNNER_TEMP}/${phase}.log" | head -200 || true
            echo "::endgroup::"
          done

      # The env files themselves, not just their names on the command line.
      # `--env-file` points at a file, so printing the argument says nothing
      # about whether OUT_DIR or CARGO_MANIFEST_DIR inside it carries an
      # absolute path -- which is the remaining live hypothesis. Also Codex's.
      - name: what the env files actually contain
        run: |
          for f in $(find -L bazel-out/ -name '*codspeed*.env' 2>/dev/null | head -5); do
            echo "::group::${f}"
            grep -a -E 'OUT_DIR|CARGO_MANIFEST|^PWD|execroot|buildbuddy' "${f}" || echo "(no path-like vars)"
            echo "::endgroup::"
          done

      # Does the locally built rlib retain ANY local absolute path?
      #
      # Two bugs in the previous version, both found by Codex, both of which
      # produced the answer I wanted rather than the true one. `grep -q` closes
      # the pipe, `strings` takes SIGPIPE, and under `pipefail` the status is
      # 141 -- so the `if` fell through to "NO" whether or not the string was
      # there. And the needle was `bazel info execution_root`, the persistent
      # outer execroot, while a sandboxed action runs under
      # `.../sandbox/linux-sandbox/<n>/execroot/_main`, which does not contain
      # it. So: dump `strings` to a file once, grep the file, and use
      # `/home/runner` as the needle, since every local absolute path on this
      # runner begins with it and no remapped path does.
      - name: absolute paths inside the locally built rlib
        run: |
          set -uo pipefail
          rlib="$(find -L bazel-out/ -name 'libcodspeed-*.rlib' -print -quit 2>/dev/null || true)"
          if [ -z "${rlib}" ]; then
            echo "no rlib on disk; nothing to inspect"
            exit 0
          fi
          echo "found ${rlib}"
          strings "${rlib}" >"${RUNNER_TEMP}/rlib.strings" || true
          echo "::group::any path under /home/runner (a local absolute path)"
          if grep -c '/home/runner' "${RUNNER_TEMP}/rlib.strings"; then
            echo "^ count above. YES: the locally built rlib DOES retain local"
            echo "absolute paths, so remapping is not what differs and the"
            echo "remote failure needs another explanation."
            grep -o '/home/runner[a-zA-Z0-9_./+-]*' "${RUNNER_TEMP}/rlib.strings" \
              | sort -u | head -20
          else
            echo "NO: no /home/runner path survives in the rlib, so remapping"
            echo "does neutralise it locally and fails to on the executor."
          fi
          echo "::endgroup::"
          echo "::group::the longest absolute paths it does carry"
          grep -o '/[a-zA-Z0-9_./+-]\{20,\}' "${RUNNER_TEMP}/rlib.strings" \
            | sort -u | head -30 || echo "(none)"
          echo "::endgroup::"
