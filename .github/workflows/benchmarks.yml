name: produce-acks lazy waiter diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/reclaim-disk
      - id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-targets: false
      - name: prepare exact sources and recorded counterfactuals
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/produce-acks-sources" "$RUNNER_TEMP/produce-acks-tmp"
          for variant in reference original lazy; do
            revision=3831a25de74804460f32d921b711e0cacef48deb
            if [[ "$variant" = reference ]]; then revision=ac9deff316d38418622b16c237c671df88f57c7a; fi
            if [[ "$variant" = lazy ]]; then revision=8f77f837a454e1195dd209aea3367d4554e7e1cf; fi
            git worktree add --detach "$RUNNER_TEMP/produce-acks-sources/$variant" "$revision"
          done
          for variant in reference original lazy; do
            source="$RUNNER_TEMP/produce-acks-sources/$variant"
            git -C "$source" rev-parse HEAD > "evidence/$variant.base-commit"
            git -C "$source" diff --binary > "evidence/$variant.patch"
            sha256sum "$source/crates/broker/src/handlers/produce.rs" > "evidence/$variant.source-sha256"
          done
          {
            echo 'Diagnostic only; modified worktrees are counterfactuals, not qualified source.'
            rustc -Vv
            uname -a
            lscpu
          } > evidence/environment.txt
      - name: test leadership fencing and its negative control
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/produce-acks-target"
          export TMPDIR="$RUNNER_TEMP/produce-acks-tmp"
          source="$RUNNER_TEMP/produce-acks-sources/lazy"
          if ! (cd "$source" && cargo test --locked -p krabka-broker --lib handlers::produce:: -- --nocapture) > evidence/lazy.tests.log 2>&1; then
            tail -80 evidence/lazy.tests.log
            exit 1
          fi
          grep -E 'test result: ok\. [1-9][0-9]* passed;' evidence/lazy.tests.log
          python3 - "$source" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])/'crates/broker/src/handlers/produce/append.rs'
          text=p.read_text()
          needle='break self.check_leadership(&images.borrow())\n                            .and(gate.map_err(|_| codes::REQUEST_TIMED_OUT));'
          assert text.count(needle)==1
          p.write_text(text.replace(needle,'break gate.map_err(|_| codes::REQUEST_TIMED_OUT);'))
          PY
          set +e
          (cd "$source" && cargo test --locked -p krabka-broker --lib leadership_change_finishes_old_acks_before_publishing_the_new_target -- --nocapture) > evidence/lazy.negative-control.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep 'leadership_change_finishes_old_acks_before_publishing_the_new_target .*FAILED' evidence/lazy.negative-control.log
          git -C "$source" restore -- crates/broker/src/handlers/produce/append.rs
          git -C "$source" diff --exit-code
          echo 'PASS: positive fencing tests passed; removing the completion leadership check is rejected' > evidence/lazy.negative-control.txt
      - name: compile each variant once
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/produce-acks-target"
          export TMPDIR="$RUNNER_TEMP/produce-acks-tmp"
          for variant in reference original lazy; do
            source="$RUNNER_TEMP/produce-acks-sources/$variant"
            (cd "$source" && cargo bench --locked -p krabka-broker -p krabka-log --bench '*' --no-run) > "evidence/$variant.build.log" 2>&1
            python3 - "$source" "$GITHUB_WORKSPACE/evidence/$variant.bench" <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          # Cargo emits the executable path in machine-readable compiler artifacts.
          output=subprocess.check_output(['cargo','bench','--locked','-p','krabka-broker','-p','krabka-log','--bench','*','--no-run','--message-format=json'],cwd=sys.argv[1],text=True)
          bins=[row for line in output.splitlines() if line.startswith('{') for row in [json.loads(line)] if row.get('reason')=='compiler-artifact' and row.get('executable') and row.get('target',{}).get('kind')==['bench'] and row.get('target',{}).get('name')=='produce']
          assert len(bins)==1,bins
          assert Path(bins[0]['target']['src_path']).is_relative_to(Path(sys.argv[1])),bins[0]
          destination=Path(sys.argv[2]);binary=Path(bins[0]['executable']).read_bytes();destination.write_bytes(binary);destination.chmod(0o755)
          destination.with_suffix('.binary-sha256').write_text(hashlib.sha256(binary).hexdigest()+'\n')
          PY
          done
      - name: four interleaved rounds with unchanged measurement settings
        run: |
          set -euo pipefail
          for round in 1 2 3 4; do
            variants=(reference original lazy)
            if ((round % 2 == 0)); then variants=(lazy original reference); fi
            for variant in "${variants[@]}"; do
              "evidence/$variant.bench" --bench 'broker/produce_acks/' \
                --output-format bencher --noplot --sample-size 20 --measurement-time 2 \
                | tee "evidence/$variant.round-$round.txt"
            done
          done
          python3 - <<'PY'
          import json,re,statistics
          from pathlib import Path
          result={'status':'diagnostic-only-not-qualification','variants':{}}
          for variant in ['reference','original','lazy']:
            cases={}
            for round in range(1,5):
              text=Path(f'evidence/{variant}.round-{round}.txt').read_text()
              matches=re.findall(r'test (broker/produce_acks/\S+) \.\.\. bench:\s+(\d+) ns/iter',text)
              assert len(matches)==6,(variant,round,matches)
              for name,value in matches: cases.setdefault(name,[]).append(int(value))
            result['variants'][variant]={name:{'rounds_ns':values,'median_ns':statistics.median(values)} for name,values in cases.items()}
          Path('evidence/diagnostic.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: produce-acks-diagnostic-${{ github.run_id }}
          path: |
            evidence/*.txt
            evidence/*.json
            evidence/*.patch
            evidence/*.base-commit
            evidence/*.source-sha256
            evidence/*.binary-sha256
            evidence/*.log
          if-no-files-found: error
