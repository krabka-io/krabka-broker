name: Intel full criterion with release tracing features
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  bench:
    name: variance-calibrated criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Require the failed runner CPU model
      id: cpu
      run: |
        mkdir -p benchmark-artifacts
        lscpu > benchmark-artifacts/cpu.txt
        if lscpu | grep -Fq 'INTEL(R) XEON(R) PLATINUM 8573C'; then
          echo 'matched=true' >> "$GITHUB_OUTPUT"
        else
          echo 'matched=false' >> "$GITHUB_OUTPUT"
          echo 'Hardware mismatch; no measurement or performance verdict.' > benchmark-artifacts/diagnostic-scope.txt
        fi
    - uses: ./.github/actions/reclaim-disk
      if: steps.cpu.outputs.matched == 'true'
    - id: toolchain
      run: |
        set -euo pipefail
        channel="$(sed -ne 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        test -n "${channel}"
        echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
      if: steps.cpu.outputs.matched == 'true'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
      if: steps.cpu.outputs.matched == 'true'
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        key: bench
      if: steps.cpu.outputs.matched == 'true'
    - id: reference
      name: resolve reference
      env:
        REFERENCE_INPUT: ac9deff316d38418622b16c237c671df88f57c7a
      run: |
        set -euo pipefail
        reference_sha="${REFERENCE_INPUT}"
        if [ -z "${reference_sha}" ]; then
          reference_sha="$(git rev-parse HEAD^)"
        fi
        git cat-file -e "${reference_sha}^{commit}"
        echo "sha=$(git rev-parse "${reference_sha}^{commit}")" >> "${GITHUB_OUTPUT}"
      if: steps.cpu.outputs.matched == 'true'
    - name: repeated same-host measurements
      shell: bash
      run: |
        set -euo pipefail
        candidate_sha=3831a25de74804460f32d921b711e0cacef48deb
        candidate_dir="${RUNNER_TEMP}/krabka-benchmark-candidate"
        git worktree add --detach "${candidate_dir}" "${candidate_sha}"
        reference_dir="${RUNNER_TEMP}/krabka-benchmark-reference"
        git worktree add --detach "${reference_dir}" '${{ steps.reference.outputs.sha }}'
        mkdir -p benchmark-artifacts/{reference,candidate}/summaries
        {
          echo "candidate=${candidate_sha}"
          echo "reference=${{ steps.reference.outputs.sha }}"
          rustc -Vv
          uname -a
          lscpu
          free -b
          df -B1 .
        } > benchmark-artifacts/environment.txt
        printf '%s\n' 'Both exact-source Bazel release graphs enable tracing/log. This trial matches that feature on both Cargo benchmark builds; baselines, cases, rounds and tolerances remain unchanged.' > benchmark-artifacts/build-scope.txt
        for side in reference candidate; do
          source_dir="$reference_dir"
          if [ "$side" = candidate ]; then source_dir="$candidate_dir"; fi
          (cd "$source_dir" && cargo tree --locked -p krabka-broker -p krabka-log --features tracing/log -e features -i tracing) > "benchmark-artifacts/$side/tracing-features.txt"
        done
        for run in 1 2 3 4; do
          sides=(reference candidate)
          if ((run % 2 == 0)); then
            sides=(candidate reference)
          fi
          for side in "${sides[@]}"; do
            run_dir="benchmark-artifacts/${side}/run-${run}"
            mkdir -p "${run_dir}"
            if [ "${side}" = reference ]; then
              source_dir="${reference_dir}"
              commit='${{ steps.reference.outputs.sha }}'
            else
              source_dir="${candidate_dir}"
              commit="${candidate_sha}"
            fi
            (
              cd "${source_dir}"
              CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target" cargo bench \
                --locked -p krabka-broker -p krabka-log --features tracing/log --bench '*' -- \
                --output-format bencher --noplot --sample-size 20 --measurement-time 2
            ) | tee "${run_dir}/raw.txt"
            cargo run -p krabka-parse-benches -- \
              --results-dir "${run_dir}" \
              --output "benchmark-artifacts/${side}/summaries/run-${run}.json" \
              --suite krabka-broker \
              --commit "${commit}"
          done
        done
      if: steps.cpu.outputs.matched == 'true'
    - name: regression verdict
      run: |
        cargo run -p krabka-parse-benches -- \
          --reference-dir benchmark-artifacts/reference/summaries \
          --candidate-dir benchmark-artifacts/candidate/summaries \
          --minimum-tolerance-percent 10 \
          --output benchmark-artifacts/verdict.json
      if: steps.cpu.outputs.matched == 'true'
    - name: summary
      if: always() && steps.cpu.outputs.matched == 'true'
      shell: bash
      run: |
        set -euo pipefail
        {
          echo '## variance-calibrated criterion verdict'
          echo
          echo '```'
          if [ -f benchmark-artifacts/verdict.json ]; then
            jq -r '"passed=\(.passed)\nbenchmarks=\(.benchmarks | length)\nreference=\(.reference_commits[0])\ncandidate=\(.candidate_commits[0])"' benchmark-artifacts/verdict.json
          else
            echo 'No verdict: measurement or validation failed.'
          fi
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"
    - name: upload raw samples and verdict
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: benchmark-regression-evidence-${{ matrix.attempt }}
        path: benchmark-artifacts/
        retention-days: 90
    strategy:
      fail-fast: false
      matrix:
        attempt:
        - 1
        - 2
        - 3
        - 4
