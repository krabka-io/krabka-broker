name: Intel test-dependency feature diagnostic
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Require the failed runner CPU model
      id: cpu
      run: |-
        mkdir -p evidence
        lscpu > evidence/cpu.txt
        if lscpu | grep -Fq 'INTEL(R) XEON(R) PLATINUM 8573C'; then
          echo 'matched=true' >> "$GITHUB_OUTPUT"
        else
          echo 'matched=false' >> "$GITHUB_OUTPUT"
          echo 'Hardware mismatch; no measurement or performance verdict.' > evidence/diagnostic-scope.txt
        fi
    - uses: ./.github/actions/reclaim-disk
      if: steps.cpu.outputs.matched == 'true'
    - id: toolchain
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
      if: steps.cpu.outputs.matched == 'true'
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
      if: steps.cpu.outputs.matched == 'true'
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        cache-targets: false
      if: steps.cpu.outputs.matched == 'true'
    - name: prepare exact sources and recorded counterfactuals
      run: |
        set -euo pipefail
        mkdir -p evidence "$RUNNER_TEMP/produce-acks-sources" "$RUNNER_TEMP/produce-acks-tmp"
        for variant in reference original no-driver; do
          revision=3831a25de74804460f32d921b711e0cacef48deb
          if [[ "$variant" = reference ]]; then revision=ac9deff316d38418622b16c237c671df88f57c7a; fi
            git worktree add --detach "$RUNNER_TEMP/produce-acks-sources/$variant" "$revision"
        done
        python3 - <<'PYCODE'
        import os
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'produce-acks-sources/no-driver/crates/broker/Cargo.toml'
        t=p.read_text();needle='krabka-bench-driver = { path = "../bench-driver" }\n'
        assert t.count(needle)==1
        p.write_text(t.replace(needle,''))
        PYCODE
        python3 - <<'PYLOCK'
        import os,subprocess
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'produce-acks-sources/no-driver'
        old=subprocess.check_output(['git','show','HEAD:Cargo.lock'],cwd=p,text=True)
        needle=' "krabka-bench-driver",\n'
        assert old.count(needle)==1
        (p/'Cargo.lock').write_text(old.replace(needle,''))
        PYLOCK
        for variant in reference original no-driver; do
          source="$RUNNER_TEMP/produce-acks-sources/$variant"
          git -C "$source" rev-parse HEAD > "evidence/$variant.base-commit"
          git -C "$source" diff --binary > "evidence/$variant.patch"
          sha256sum "$source/crates/broker/src/handlers/produce.rs" "$source/crates/broker/src/handlers/produce/append.rs" "$source/crates/broker/src/handlers/produce/producer_checks.rs" > "evidence/$variant.source-sha256"
        done
        {
          echo 'Diagnostic only; modified worktrees are counterfactuals, not qualified source.'
          rustc -Vv
          uname -a
          lscpu
        } > evidence/environment.txt
      if: steps.cpu.outputs.matched == 'true'
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
    - name: compile each variant once
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="$RUNNER_TEMP/produce-acks-target"
        export TMPDIR="$RUNNER_TEMP/produce-acks-tmp"
        for variant in reference original no-driver; do
          source="$RUNNER_TEMP/produce-acks-sources/$variant"
          (cd "$source" && cargo tree --locked -p krabka-broker -p krabka-log -e features -i tracing) > "evidence/$variant.feature-tree"
          (cd "$source" && cargo bench --locked -p krabka-broker -p krabka-log --bench '*' --no-run) > "evidence/$variant.build.log" 2>&1
          python3 - "$source" "$GITHUB_WORKSPACE/evidence/$variant.bench" <<'PY'
        import hashlib,json,os,subprocess,sys
        from pathlib import Path
        # Cargo emits the executable path in machine-readable compiler artifacts.
        output=subprocess.check_output(['cargo','bench','--locked','-p','krabka-broker','-p','krabka-log','--bench','*','--no-run','--message-format=json'],cwd=sys.argv[1],text=True)
        bins=[row for line in output.splitlines() if line.startswith('{') for row in [json.loads(line)] if row.get('reason')=='compiler-artifact' and row.get('executable') and row.get('target',{}).get('kind')==['bench'] and row.get('target',{}).get('name')=='produce']
        assert len(bins)==1,bins
        assert Path(bins[0]['target']['src_path']).is_relative_to(Path(sys.argv[1])),bins[0]
        destination=Path(sys.argv[2]);binary=Path(bins[0]['executable']).read_bytes();destination.write_bytes(binary);destination.chmod(0o755)
        destination.with_suffix('.binary-sha256').write_text(hashlib.sha256(binary).hexdigest()+'\n')
        PY
        done
      if: steps.cpu.outputs.matched == 'true'
    - name: four interleaved rounds with unchanged measurement settings
      run: |
        set -euo pipefail
        for round in 1 2 3 4; do
          variants=(reference original no-driver)
          if ((round % 2 == 0)); then variants=(no-driver original reference); fi
          for variant in "${variants[@]}"; do
            "evidence/$variant.bench" --bench \
              --output-format bencher --noplot --sample-size 20 --measurement-time 2 \
              | tee "evidence/$variant.round-$round.txt"
          done
        done
        python3 - <<'PY'
        import json,re,statistics
        from pathlib import Path
        result={'status':'diagnostic-only-not-qualification','variants':{}}
        for variant in ['reference','original','no-driver']:
          cases={}
          for round in range(1,5):
            text=Path(f'evidence/{variant}.round-{round}.txt').read_text()
            matches=re.findall(r'test (broker/produce\S+) \.\.\. bench:\s+(\d+) ns/iter',text)
            assert len(matches)==15,(variant,round,matches)
            for name,value in matches: cases.setdefault(name,[]).append(int(value))
          result['variants'][variant]={name:{'rounds_ns':values,'median_ns':statistics.median(values)} for name,values in cases.items()}
        Path('evidence/diagnostic.json').write_text(json.dumps(result,indent=2)+'\n')
        print(json.dumps(result,indent=2))
        PY
      if: steps.cpu.outputs.matched == 'true'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: intel-produce-feature-unification-${{ github.run_id }}-${{ matrix.attempt }}
        path: |
          evidence/*.txt
          evidence/*.json
          evidence/*.patch
          evidence/*.base-commit
          evidence/*.source-sha256
          evidence/*.binary-sha256
          evidence/*.log

           evidence/*.feature-tree
        if-no-files-found: error
    strategy:
      matrix:
        attempt:
        - 1
        - 2
'on':
  workflow_dispatch: null
