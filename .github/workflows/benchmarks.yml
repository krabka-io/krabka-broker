name: Intel test-dependency feature diagnostic
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Require the failed runner CPU model
      id: cpu
      run: "mkdir -p evidence\nlscpu > evidence/cpu.txt\nif lscpu | grep -Fq 'INTEL(R) XEON(R) PLATINUM 8573C'; then\n  echo 'matched=true' >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'matched=false' >> \"$GITHUB_OUTPUT\"\n  echo 'Hardware mismatch; no measurement or performance verdict.' > evidence/diagnostic-scope.txt\nfi"
    - uses: ./.github/actions/reclaim-disk
      if: steps.cpu.outputs.matched == 'true'
    - id: toolchain
      run: 'channel=$(sed -n ''s/^channel = "\(.*\)"/\1/p'' rust-toolchain.toml)

        test -n "$channel"

        echo "channel=$channel" >> "$GITHUB_OUTPUT"

        '
      if: steps.cpu.outputs.matched == 'true'
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
      if: steps.cpu.outputs.matched == 'true'
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        cache-targets: false
      if: steps.cpu.outputs.matched == 'true'
    - name: prepare exact sources and recorded counterfactuals
      run: "set -euo pipefail\nmkdir -p evidence \"$RUNNER_TEMP/produce-acks-sources\" \"$RUNNER_TEMP/produce-acks-tmp\"\nfor variant in reference original no-driver; do\n  revision=3831a25de74804460f32d921b711e0cacef48deb\n  if [[ \"$variant\" = reference ]]; then revision=ac9deff316d38418622b16c237c671df88f57c7a; fi\n    git worktree add --detach \"$RUNNER_TEMP/produce-acks-sources/$variant\" \"$revision\"\ndone\npython3 - <<'PYCODE'\nimport os\nfrom pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'produce-acks-sources/no-driver/crates/broker/Cargo.toml'\nt=p.read_text();needle='krabka-bench-driver = { path = \"../bench-driver\" }\\n'\nassert t.count(needle)==1\np.write_text(t.replace(needle,''))\nPYCODE\n(cd \"$RUNNER_TEMP/produce-acks-sources/no-driver\" && cargo tree --offline -p krabka-broker -p krabka-log -e features -i tracing > /dev/null)\npython3 - <<'PYLOCK'\nimport os,subprocess\nfrom pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'produce-acks-sources/no-driver'\nold=subprocess.check_output(['git','show','HEAD:Cargo.lock'],cwd=p,text=True)\n\
        new=(p/'Cargo.lock').read_text()\nneedle=' \"krabka-bench-driver\",\\n'\nassert old.count(needle)==1\nassert new==old.replace(needle,''), 'Unexpected lockfile dependency drift'\nPYLOCK\nfor variant in reference original no-driver; do\n  source=\"$RUNNER_TEMP/produce-acks-sources/$variant\"\n  git -C \"$source\" rev-parse HEAD > \"evidence/$variant.base-commit\"\n  git -C \"$source\" diff --binary > \"evidence/$variant.patch\"\n  sha256sum \"$source/crates/broker/src/handlers/produce.rs\" \"$source/crates/broker/src/handlers/produce/append.rs\" \"$source/crates/broker/src/handlers/produce/producer_checks.rs\" > \"evidence/$variant.source-sha256\"\ndone\n{\n  echo 'Diagnostic only; modified worktrees are counterfactuals, not qualified source.'\n  rustc -Vv\n  uname -a\n  lscpu\n} > evidence/environment.txt\n"
      if: steps.cpu.outputs.matched == 'true'
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
    - name: compile each variant once
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      run: "set -euo pipefail\nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/produce-acks-target\"\nexport TMPDIR=\"$RUNNER_TEMP/produce-acks-tmp\"\nfor variant in reference original no-driver; do\n  source=\"$RUNNER_TEMP/produce-acks-sources/$variant\"\n  (cd \"$source\" && cargo tree --locked -p krabka-broker -p krabka-log -e features -i tracing) > \"evidence/$variant.feature-tree\"\n  (cd \"$source\" && cargo bench --locked -p krabka-broker -p krabka-log --bench '*' --no-run) > \"evidence/$variant.build.log\" 2>&1\n  python3 - \"$source\" \"$GITHUB_WORKSPACE/evidence/$variant.bench\" <<'PY'\nimport hashlib,json,os,subprocess,sys\nfrom pathlib import Path\n# Cargo emits the executable path in machine-readable compiler artifacts.\noutput=subprocess.check_output(['cargo','bench','--locked','-p','krabka-broker','-p','krabka-log','--bench','*','--no-run','--message-format=json'],cwd=sys.argv[1],text=True)\nbins=[row for line in output.splitlines() if line.startswith('{') for row in [json.loads(line)]\
        \ if row.get('reason')=='compiler-artifact' and row.get('executable') and row.get('target',{}).get('kind')==['bench'] and row.get('target',{}).get('name')=='produce']\nassert len(bins)==1,bins\nassert Path(bins[0]['target']['src_path']).is_relative_to(Path(sys.argv[1])),bins[0]\ndestination=Path(sys.argv[2]);binary=Path(bins[0]['executable']).read_bytes();destination.write_bytes(binary);destination.chmod(0o755)\ndestination.with_suffix('.binary-sha256').write_text(hashlib.sha256(binary).hexdigest()+'\\n')\nPY\ndone\n"
      if: steps.cpu.outputs.matched == 'true'
    - name: four interleaved rounds with unchanged measurement settings
      run: "set -euo pipefail\nfor round in 1 2 3 4; do\n  variants=(reference original no-driver)\n  if ((round % 2 == 0)); then variants=(no-driver original reference); fi\n  for variant in \"${variants[@]}\"; do\n    \"evidence/$variant.bench\" --bench \\\n      --output-format bencher --noplot --sample-size 20 --measurement-time 2 \\\n      | tee \"evidence/$variant.round-$round.txt\"\n  done\ndone\npython3 - <<'PY'\nimport json,re,statistics\nfrom pathlib import Path\nresult={'status':'diagnostic-only-not-qualification','variants':{}}\nfor variant in ['reference','original','no-driver']:\n  cases={}\n  for round in range(1,5):\n    text=Path(f'evidence/{variant}.round-{round}.txt').read_text()\n    matches=re.findall(r'test (broker/produce\\S+) \\.\\.\\. bench:\\s+(\\d+) ns/iter',text)\n    assert len(matches)==15,(variant,round,matches)\n    for name,value in matches: cases.setdefault(name,[]).append(int(value))\n  result['variants'][variant]={name:{'rounds_ns':values,'median_ns':statistics.median(values)}\
        \ for name,values in cases.items()}\nPath('evidence/diagnostic.json').write_text(json.dumps(result,indent=2)+'\\n')\nprint(json.dumps(result,indent=2))\nPY\n"
      if: steps.cpu.outputs.matched == 'true'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: intel-produce-feature-unification-${{ github.run_id }}-${{ matrix.attempt }}
        path: "evidence/*.txt\nevidence/*.json\nevidence/*.patch\nevidence/*.base-commit\nevidence/*.source-sha256\nevidence/*.binary-sha256\nevidence/*.log\n\n evidence/*.feature-tree\n"
        if-no-files-found: error
    strategy:
      matrix:
        attempt:
        - 1
        - 2
'on':
  workflow_dispatch: null
