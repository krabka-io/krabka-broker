name: run a script on a BuildBuddy remote runner
description: Run a bash script through `bb remote` when the run holds a BuildBuddy API key, and on this runner otherwise.

# The heavy CI jobs -- `ci`, `coverage` and `cargo` -- compile on whatever
# machine runs them. rustc codegen cannot use remote execution yet (see the
# `build:rbe` block in .bazelrc), so on a GitHub runner that meant four cores
# compiling, then downloading every test binary it ran. A BuildBuddy remote
# runner is a Firecracker VM restored from a snapshot of the lane's last run:
# its Bazel server, output tree and Cargo target directory are already warm,
# and nothing comes back here but the log.
#
# Snapshots key on the remote instance, the platform properties, the VM shape
# and the git branch, and fall back to the pull request's base and then the
# default branch. `lane` is a platform property of its own so that each job
# keeps a snapshot of its own state rather than restoring another job's.
# Pushes to `main` always save one, which is what keeps every pull request
# warm; a pull request saves one only when none exists for its branch.
#
# Bazel on the runner already reads and writes BuildBuddy's remote cache and
# streams to its BES: run 39712230796's remote invocations show remote cache
# hits with no flags of ours. The coverage job depends on that: its remote run
# fills the cache so that a `bazel coverage` here only reads. A pull request's
# run reads and never writes, as on a GitHub runner.
#
# The runner has no `user.bazelrc` from `.github/actions/remote-cache`, so the
# prelude writes the remote *execution* half of it: `--config=rbe` then means on
# the runner what it means here. BuildBuddy's own bazelrc already carries the
# API key header those actions authenticate with.
#
# `docker: true` starts a Docker daemon in the runner's VM. The container
# suites execute on microVMs of their own, but an action that cannot start
# remotely falls back to the machine that invoked Bazel
# (`--remote_local_fallback`), and there it needs a daemon as it had on a
# GitHub runner.
#
# A run without a key -- a fork's pull request -- runs the same script here,
# after reclaiming the disk that a local build needs.

inputs:
  script:
    description: The bash script to run.
    required: true
  lane:
    description: A name that keeps this job's runner snapshot apart from other jobs'.
    required: true
  api-key:
    description: A BuildBuddy API key. Empty means run here.
    required: false
    default: ""
  upload:
    description: Whether Bazel may write to the remote cache. Only trusted contexts should.
    required: false
    default: "false"
  env:
    description: Extra NAME=VALUE lines to set for the script, one per line. Not for secrets.
    required: false
    default: ""
  cpu:
    description: Cores for the remote runner.
    required: false
    default: "16"
  memory:
    description: Memory for the remote runner.
    required: false
    default: 64GB
  disk:
    description: Free disk for the remote runner. BuildBuddy caps it at 100GB.
    required: false
    default: 80GB
  timeout:
    description: How long the remote run may take.
    required: false
    default: 80m
  docker:
    description: Whether the remote runner starts a Docker daemon.
    required: false
    default: "false"

outputs:
  remote:
    description: Whether the script ran on a BuildBuddy remote runner.
    value: ${{ steps.mode.outputs.remote }}

runs:
  using: composite
  steps:
    - id: mode
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: |
        if [ -n "${API_KEY}" ]; then
          echo "remote=true" >>"${GITHUB_OUTPUT}"
        else
          echo "No BuildBuddy key on this run: the script runs on this runner."
          echo "remote=false" >>"${GITHUB_OUTPUT}"
        fi

    - if: steps.mode.outputs.remote != 'true'
      uses: ./.github/actions/reclaim-disk

    # The `bb` CLI, pinned. install.buildbuddy.io finds the latest release
    # through an unauthenticated api.github.com call, which GitHub limits per
    # IP; runners share IPs, and the call answered 403 on run 39741856418. A
    # release download from github.com is not that API, and the checksum
    # pins what it serves.
    - if: steps.mode.outputs.remote == 'true'
      shell: bash
      env:
        BB_VERSION: 5.0.496
        BB_SHA256: 4dba5a0c377339b9e4b4053e812fe33da8fe917d22eee533b642ffdf210f2d10
      run: |
        set -euo pipefail
        bb="${RUNNER_TEMP}/bb"
        curl -fsSL --retry 5 -o "${bb}" \
          "https://github.com/buildbuddy-io/bazel/releases/download/${BB_VERSION}/bazel-${BB_VERSION}-linux-x86_64"
        echo "${BB_SHA256}  ${bb}" | sha256sum -c -
        sudo install -m 0755 "${bb}" /usr/local/bin/bb

    - if: steps.mode.outputs.remote == 'true'
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.api-key }}
        SCRIPT: ${{ inputs.script }}
        LANE: ${{ inputs.lane }}
        UPLOAD: ${{ inputs.upload }}
        EXTRA_ENV: ${{ inputs.env }}
        CPU: ${{ inputs.cpu }}
        MEMORY: ${{ inputs.memory }}
        DISK: ${{ inputs.disk }}
        TIMEOUT: ${{ inputs.timeout }}
        DOCKER: ${{ inputs.docker }}
        SNAPSHOT_SAVE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'none-available' || 'always' }}
        REMOTE_PRELUDE: |
          set -euo pipefail
          # The VM's /tmp is size-limited; test logs need the workspace disk.
          TMPDIR="$(mktemp -d "${PWD}/../krabka-ci-tmp.XXXXXX")"
          export TMPDIR
          trap 'rm -rf -- "${TMPDIR}"' EXIT
          {
            echo "build:rbe --remote_executor=grpcs://remote.buildbuddy.io"
            echo "build:rbe --extra_execution_platforms=//bazel:rbe_linux_x86_64"
            echo "build:rbe --jobs=100"
          } >>user.bazelrc
          if [ "${UPLOAD:-false}" != "true" ]; then
            echo "build --noremote_upload_local_results" >>user.bazelrc
          fi
          # Guest clock report. From 2026-10-28 17:20 the `cargo` lane failed
          # four of five trusted runs in one bench-driver test whose timers
          # fired early: a body that sleeps 200 ms and drains for up to 1 s
          # finished in 0.00 s by its own clock, and in run 40756074639
          # nextest timed the process at 0.066 s while the process measured
          # itself at 1.25 s. The same test passed 80 of 80 runs on a
          # workstation under a 32-way CPU load. That is CLOCK_MONOTONIC
          # disagreeing between CPUs of the restored VM. Record the
          # clocksource and the per-CPU offsets at the start of every remote
          # run, and annotate the run when they are off, so the next failure
          # carries its evidence.
          echo "clocksource: $(cat /sys/devices/system/clocksource/clocksource0/current_clocksource 2>/dev/null || echo unknown)"
          if command -v python3 >/dev/null; then
            python3 - <<'PY' || echo "::warning::guest clock report failed"
          import os
          import time

          # CLOCK_MONOTONIC on each CPU against the first CPU of the affinity
          # mask. Each sample brackets the read on the CPU under test between
          # two reads on the reference CPU, so the migrations cancel; the
          # tightest of five brackets is the one least disturbed by scheduling.
          cpus = sorted(os.sched_getaffinity(0))
          ref = cpus[0]
          offsets = {}
          for cpu in cpus:
              best = None
              for _ in range(5):
                  os.sched_setaffinity(0, {ref})
                  t1 = time.monotonic()
                  os.sched_setaffinity(0, {cpu})
                  t2 = time.monotonic()
                  os.sched_setaffinity(0, {ref})
                  t3 = time.monotonic()
                  if best is None or t3 - t1 < best[0]:
                      best = (t3 - t1, t2 - (t1 + t3) / 2)
              offsets[cpu] = best[1]
          os.sched_setaffinity(0, set(cpus))
          worst = max(offsets.values(), key=abs)
          print(
              "monotonic offset per CPU against CPU %d (s): %s"
              % (ref, " ".join("%d:%+.6f" % (cpu, off) for cpu, off in offsets.items()))
          )

          # One second of sleep on the monotonic and the wall clocks.
          m0, w0 = time.monotonic(), time.time()
          time.sleep(1.0)
          dm, dw = time.monotonic() - m0, time.time() - w0
          print("sleep 1 s: monotonic %.6f s, wall %.6f s" % (dm, dw))

          if abs(worst) > 0.01 or abs(dm - dw) > 0.05 or abs(dm - 1.0) > 0.5:
              print(
                  "::warning::guest clock skew: worst per-CPU monotonic offset %+.6f s, "
                  "1 s sleep took %.3f s monotonic and %.3f s wall" % (worst, dm, dw)
              )
          PY
          else
            echo "python3 absent on the runner: per-CPU clock check skipped"
          fi
      run: |
        set -euo pipefail
        env_flags=(--env=UPLOAD="${UPLOAD}")
        while IFS= read -r line; do
          [ -n "${line}" ] && env_flags+=(--env="${line}")
        done <<<"${EXTRA_ENV}"
        runner_flags=()
        if [ "${DOCKER}" = "true" ]; then
          runner_flags+=(--runner_exec_properties=init-dockerd=true)
        fi
        bb remote \
          --run_from_commit="${GITHUB_SHA}" \
          --timeout="${TIMEOUT}" \
          "${env_flags[@]}" \
          "${runner_flags[@]}" \
          --runner_exec_properties=krabka-ci-lane="${LANE}" \
          --runner_exec_properties=EstimatedCPU="${CPU}" \
          --runner_exec_properties=EstimatedMemory="${MEMORY}" \
          --runner_exec_properties=EstimatedFreeDiskBytes="${DISK}" \
          --runner_exec_properties=snapshot-read-policy=local-first \
          --remote_run_header=x-buildbuddy-platform.remote-snapshot-save-policy="${SNAPSHOT_SAVE}" \
          --script="$(printf '%s\n%s\n' "${REMOTE_PRELUDE}" "${SCRIPT}")"
    - if: steps.mode.outputs.remote != 'true'
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
        UPLOAD: ${{ inputs.upload }}
        EXTRA_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        while IFS= read -r line; do
          [ -n "${line}" ] && export "${line?}"
        done <<<"${EXTRA_ENV}"
        if [ "${UPLOAD}" != "true" ]; then
          echo "build --noremote_upload_local_results" >>user.bazelrc
        fi
        bash -c "${SCRIPT}"
