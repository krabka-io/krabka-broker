# A three-node krabka cluster: one StatefulSet, one image, one pod template.
#
# Every per-pod difference comes from the pod's ordinal, which the StatefulSet
# controller publishes as the `apps.kubernetes.io/pod-index` label. The
# downward API turns that into KRABKA_POD_INDEX, and Kubernetes expands
# `$(KRABKA_POD_INDEX)` in `args`, so the node id and the broker id are the
# ordinal without a shell to compute them in: the apko base the image is built
# on carries none. That label is what sets the floor on the Kubernetes version
# these manifests need: it reached beta, and so became set by default, in 1.29.
# On anything older KRABKA_POD_INDEX resolves to the empty string and the
# format step fails on `--node-id=`.
#
# Kubernetes expands an env value against the variables declared *before* it,
# so POD_NAMESPACE leads each list that a later value interpolates it into.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: krabka
  labels:
    app.kubernetes.io/name: krabka
spec:
  serviceName: krabka
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: krabka
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krabka
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: krabka-config
        - name: tls
          secret:
            secretName: krabka-tls
            defaultMode: 0400
            items:
              - {key: ca.crt, path: ca.crt}
              - {key: broker-0.crt, path: broker-0.crt}
              - {key: broker-0.key, path: broker-0.key}
              - {key: broker-1.crt, path: broker-1.crt}
              - {key: broker-1.key, path: broker-1.key}
              - {key: broker-2.crt, path: broker-2.crt}
              - {key: broker-2.key, path: broker-2.key}
      # A three-voter quorum on one node is still one failure domain. Refuse
      # that placement instead of letting a node loss take the majority.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: krabka
      # This digest is the signed, qualified v1.0.6 multi-platform index;
      # Kubernetes selects the image matching the node architecture.
      # The controlled-shutdown drain hands this node's partition leadership
      # to its in-sync replicas before the process stops, and defaults to a
      # 20s budget. The grace period has to outlast that, or SIGKILL lands
      # mid-hand-off and producers stall until the controller fences the node.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The volume arrives owned by root. Both the formatter and the broker
        # run as the image's `nonroot` user, so without fsGroup the format
        # step fails on `meta.properties` before it writes a byte.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The broker refuses to boot against an unformatted log directory, so
        # this runs on every start. `--ignore-formatted` is what makes that
        # safe: on the first boot it seeds the directory, and on every boot
        # after it exits 0 without touching the identity already there.
        - name: format
          image: ghcr.io/krabka-io/krabka-broker@sha256:ad5195370c6e55fbb9bb5c31a2dd244c62e5b407f9f6f6e89c01a45aee2e4222
          command: ["/usr/bin/krabka-format"]
          args:
            - --log-dir=/var/lib/krabka
            - --node-id=$(KRABKA_POD_INDEX)
            - --cluster-id=$(KRABKA_CLUSTER_ID)
            - --initial-controllers=$(KRABKA_INITIAL_CONTROLLERS)
            - --ignore-formatted
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KRABKA_POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            # One cluster id, shared by all three pods. It has to be passed
            # explicitly: each pod formats its own volume, and `krabka format`
            # generates a fresh id when none is given, so three pods would
            # bootstrap three one-node clusters that cannot recognise each
            # other's records.
            #
            # GENERATE YOUR OWN before you deploy this, the same way you
            # generate the directory ids below.
            - name: KRABKA_CLUSTER_ID
              value: "b3c1e2d4-7f6a-4c58-9b21-0e5d8a4f3c10"
            # The KIP-853 seed voter set: `id@host:port:directory-id` per
            # controller, comma-separated with no spaces. Each node reads its
            # own directory id back out of this list, which is why one shared
            # string configures all three.
            #
            # GENERATE YOUR OWN directory ids before you deploy this. They are
            # the replicated identity of a node incarnation, and two clusters
            # that share them cannot tell each other's nodes apart.
            - name: KRABKA_INITIAL_CONTROLLERS
              value: "0@krabka-0.krabka.$(POD_NAMESPACE).svc.cluster.local:9093:5bd0e3ba-9f0e-4a4d-9d1c-2c9a0d2f7a01,1@krabka-1.krabka.$(POD_NAMESPACE).svc.cluster.local:9093:5bd0e3ba-9f0e-4a4d-9d1c-2c9a0d2f7a02,2@krabka-2.krabka.$(POD_NAMESPACE).svc.cluster.local:9093:5bd0e3ba-9f0e-4a4d-9d1c-2c9a0d2f7a03"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/krabka
            - name: tmp
              mountPath: /tmp
      containers:
        - name: broker
          image: ghcr.io/krabka-io/krabka-broker@sha256:ad5195370c6e55fbb9bb5c31a2dd244c62e5b407f9f6f6e89c01a45aee2e4222
          args:
            - --config-file=/etc/krabka/config/broker-$(KRABKA_POD_INDEX).toml
            - --broker-id=$(KRABKA_POD_INDEX)
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: metrics
              containerPort: 9404
            - name: health
              containerPort: 9405
          env:
            - name: KRABKA_POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            # Match the cluster id written by the formatter.
            - name: KRABKA_CLUSTER_ID
              value: "b3c1e2d4-7f6a-4c58-9b21-0e5d8a4f3c10"
            - name: KRABKA_METRICS_LISTEN_ADDR
              value: 0.0.0.0:9404
            - name: KRABKA_HEALTH_LISTEN_ADDR
              value: 0.0.0.0:9405
          # Liveness asks only whether the process is still running its event
          # loop. It stays green through log-dir recovery and through metadata
          # catch-up on purpose: those are the phases where a restart is most
          # expensive, and a liveness probe that failed there would kill the
          # node and make it start the same recovery over again. Nothing here
          # needs a startupProbe for the same reason -- there is no slow-start
          # window in which this probe can fail.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          # Readiness asks whether this node can serve a client correctly: log
          # dirs recovered, listeners bound, and its `__cluster_metadata`
          # offset within the configured lag of the quorum's committed offset.
          # Failing it only removes the pod from the Service endpoints, which
          # is exactly what should happen to a node that would answer Metadata
          # from a stale image. A rolling update waits on this, so a restart
          # cannot run ahead of the quorum.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/krabka
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/krabka/config
              readOnly: true
            - name: tls
              mountPath: /etc/krabka/tls
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
