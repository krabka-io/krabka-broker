# The broker image, built from Wolfi packages by a standalone `apko build`.
#
# This is NOT the image this repository ships. //packaging builds that one:
# `base.apko.yaml` gives the locked Wolfi base, and rules_img adds the
# Bazel-built binaries as layers. Read //packaging/BUILD.bazel for it.
#
# This recipe is the other path, the one that composes the image out of
# published Wolfi packages alone. It needs an apk named `krabka-broker` in a
# repository apko can reach. The melange recipe that produced that apk built
# ten binaries from the one monorepo workspace; it is a reference recipe in
# `krabka-io/tooling` now and no pipeline runs it. So the `krabka-broker`
# package below has no producer today. Point `--repository-append` at a local
# apk repository that holds one, or use the Bazel path above.
#
# Everything except the package list matches `../base.apko.yaml` and the
# `image_manifest` in //packaging/BUILD.bazel: the same nonroot account, the
# same `/var/lib/krabka` working directory, and the one architecture the
# repository builds and publishes.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - glibc
    - wolfi-baselayout
    - krabka-broker

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      shell: /sbin/nologin
  run-as: nonroot

paths:
  - path: /var/lib/krabka
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /var/lib/krabka

entrypoint:
  command: /usr/bin/krabka-broker

cmd: run

archs:
  - amd64
