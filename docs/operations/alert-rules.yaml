# Prometheus alert rules for krabka-broker.
#
# Every threshold here is the one the metric's doc comment in
# `crates/broker/src/metrics.rs` recommends. A rule whose comment names no
# threshold says so in its `description`, and the number it carries is a
# starting point for the operator to tune. Each rule names the runbook that
# says what to do when it fires.
#
# `aspect check-metrics-contract` and the `metrics_contract` suite in
# `crates/broker/tests/` check that every series an `expr` names is one the
# broker exports. Load the file with `promtool check rules`.
groups:
  - name: krabka-broker-cluster
    rules:
      - alert: KrabkaNoActiveController
        expr: (sum(krabka_broker_active_controller) != 1) or absent(krabka_broker_active_controller)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "the cluster has {{ $value }} active controllers, not 1"
          description: "Exactly one broker holds raft leadership of the metadata quorum. Zero means no metadata change commits; more than one means the scrape spans two clusters."
          runbook: docs/operations/runbooks/no-active-controller.md

      - alert: KrabkaBrokerDown
        expr: up{job="krabka-broker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} does not answer a scrape"
          description: "Prometheus cannot reach the broker's /metrics endpoint. Every other rule is per-instance and stops firing for a broker whose series are gone, so this rule is the one that sees a dead process."
          runbook: docs/operations/runbooks/broker-down.md

      - alert: KrabkaMetadataLag
        expr: krabka_broker_metadata_lag_records > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} trails the metadata quorum by {{ $value }} records"
          description: "The node's applied __cluster_metadata offset is behind the quorum's committed offset. 100 records is DEFAULT_READINESS_MAX_METADATA_LAG in crates/broker/src/config.rs, the same bound /readyz reports metadata_lag against."
          runbook: docs/operations/runbooks/metadata-quorum-loss.md

  - name: krabka-broker-availability
    rules:
      - alert: KrabkaUnderReplicatedPartitions
        expr: krabka_broker_under_replicated_partitions > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} leads {{ $value }} under-replicated partitions"
          description: "A partition this broker leads has an ISR smaller than its replica set. A stuck follower fails an unclean election later."
          runbook: docs/operations/runbooks/under-replicated-partitions.md

      - alert: KrabkaUnderMinIsrPartitions
        expr: krabka_broker_under_min_isr_partition_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} leads {{ $value }} partitions below min.insync.replicas"
          description: "These partitions reject acks=all produces with NOT_ENOUGH_REPLICAS. Writes are blocked."
          runbook: docs/operations/runbooks/under-min-isr-partitions.md

      - alert: KrabkaOfflinePartitions
        expr: krabka_broker_offline_partitions_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} reports {{ $value }} offline partitions"
          description: "A partition has no live leader. It is unavailable until an ISR member returns or an unclean election runs."
          runbook: docs/operations/runbooks/offline-partitions.md

      - alert: KrabkaLeaderSiteDrift
        expr: krabka_broker_leader_site_drift_partitions > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} leads {{ $value }} partitions away from the preferred site"
          description: "Leadership drifted off the stretch cluster's preferred leader site and no rebalance has undone it."
          runbook: docs/operations/runbooks/leader-site-drift.md

      - alert: KrabkaControllerLeaderFlapping
        expr: rate(krabka_broker_controller_leader_changes_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} keeps observing controller leader changes"
          description: "The raft leader changed repeatedly over ten minutes. One election is normal; a sustained rate is flapping."
          runbook: docs/operations/runbooks/controller-leader-flapping.md

      - alert: KrabkaUncleanLeaderElection
        expr: rate(krabka_broker_unclean_leader_elections_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} drove an unclean leader election"
          description: "The controller elected a leader from outside the ISR. Committed records may be lost."
          runbook: docs/operations/runbooks/unclean-leader-election.md

  - name: krabka-broker-lag
    rules:
      - alert: KrabkaReplicaLag
        expr: krabka_broker_replica_lag_max_records > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has a follower {{ $value }} records behind"
          description: "A follower of a partition this broker leads trails the leader's log end. It is still in the ISR; the metric comment names no threshold, and 10000 records over ten minutes is a starting point."
          runbook: docs/operations/runbooks/replica-lag.md

      - alert: KrabkaConsumerGroupLag
        expr: krabka_broker_consumer_group_lag_records > 10000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "group {{ $labels.group_id }} is {{ $value }} records behind on {{ $labels.topic }}-{{ $labels.partition }}"
          description: "The group's committed offset trails the partition's high watermark. The metric comment names no threshold; 10000 records over fifteen minutes is a starting point, and a busy topic needs a larger number."
          runbook: docs/operations/runbooks/consumer-group-lag.md

  - name: krabka-broker-requests
    rules:
      - alert: KrabkaUnsupportedApiRequests
        expr: sum by (instance, api_key) (rate(krabka_broker_unsupported_api_requests_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} rejects {{ $labels.api_key }} requests at a version it does not speak"
          description: "A client sends an api_key and version pair outside the registered range. This is usually upgrade skew or a misconfigured client."
          runbook: docs/operations/runbooks/unsupported-api-requests.md

      - alert: KrabkaRequestErrors
        expr: sum by (instance, api_key) (rate(krabka_broker_request_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} handler errors on {{ $labels.api_key }}"
          description: "A request handler returned an error and the dispatcher closed the connection."
          runbook: docs/operations/runbooks/request-errors.md

      - alert: KrabkaFailedProduceRequests
        expr: sum by (instance, topic) (rate(krabka_broker_topic_failed_produce_requests_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} returns Produce errors on {{ $labels.topic }}"
          description: "Produce partition responses carry a non-zero error code. Quota, ACL and NOT_ENOUGH_REPLICAS storms all land here."
          runbook: docs/operations/runbooks/failed-produce-requests.md

      - alert: KrabkaIdleConnectionCloses
        expr: rate(krabka_broker_connection_closes_total{reason="idle"}[5m]) > 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} closes more than one idle connection per second"
          description: "A peer opens connections and then sends nothing. The metric comment names the signal but no threshold; one per second is a starting point."
          runbook: docs/operations/runbooks/idle-connection-closes.md

  - name: krabka-broker-saturation
    rules:
      - alert: KrabkaRequestLatencyHigh
        expr: histogram_quantile(0.99, sum by (le, instance, api_key) (rate(krabka_broker_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} answers {{ $labels.api_key }} in {{ $value }}s at p99"
          description: "The full handler round trip is slow while the broker is up and every partition is in-ISR. This is the shape an operator gets as producer timeouts and no page. The metric comment names no threshold; one second at p99 for ten minutes is a starting point, and a cluster whose clients set a shorter request.timeout.ms needs a smaller one."
          runbook: docs/operations/runbooks/broker-saturation.md

      - alert: KrabkaQuotaThrottleHigh
        expr: histogram_quantile(0.99, sum by (le, instance, quota_type) (rate(krabka_broker_quota_throttle_duration_seconds_bucket[5m]))) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} sleeps {{ $value }}s at p99 on the {{ $labels.quota_type }} quota"
          description: "The broker is holding clients in the KIP-219 throttle. The series only observes throttled requests, so this fires on how hard the quota bites rather than on how many requests meet it. The metric comment names no threshold; one second at p99 over fifteen minutes is a starting point."
          runbook: docs/operations/runbooks/broker-saturation.md

      - alert: KrabkaInFlightRequestsClimbing
        expr: min_over_time(krabka_broker_in_flight_requests[10m]) > 64
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} holds {{ $value }} requests in flight and the floor is not falling"
          description: "The metric comment says a sustained climb is a handler stall or a wedged controller. min_over_time is what separates a busy broker, whose in-flight count returns to a low floor, from one whose floor has moved up. The comment names no threshold; 64 requests over ten minutes is a starting point to tune against the fleet's normal floor."
          runbook: docs/operations/runbooks/broker-saturation.md

      - alert: KrabkaFetchZeroCopyLost
        expr: sum by (instance) (rate(krabka_broker_fetch_response_drain_total{path="sendfile"}[5m])) == 0 and sum by (instance) (rate(krabka_broker_fetch_response_drain_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} drains no Fetch response through sendfile"
          description: "Fetches are being served and none of them takes the zero-copy path. On a plaintext cluster the metric's own comment calls this a zero-copy regression. Scope this rule to the brokers whose consumers read plaintext, or whose TLS listeners have krabka_broker_ktls_enabled at 1: a TLS listener without kTLS encrypts in userspace and legitimately reports no sendfile."
          runbook: docs/operations/runbooks/fetch-zero-copy-regression.md

  - name: krabka-broker-subsystems
    rules:
      - alert: KrabkaRlmmBootstrapStuck
        expr: min_over_time(krabka_broker_tiered_storage_rlmm_topic_backed[5m]) == 0 and rate(krabka_broker_tiered_storage_rlmm_bootstrap_attempts_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} cannot bootstrap the topic-backed RLMM"
          description: "The broker keeps retrying the __remote_log_metadata bootstrap and still answers from the fail-closed placeholder. Tiered reads and copies wait."
          runbook: docs/operations/runbooks/rlmm-bootstrap-stuck.md

      - alert: KrabkaRemoteCopyErrors
        expr: rate(krabka_broker_remote_copy_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} cannot copy {{ $labels.topic }} to the remote tier"
          description: "Segment copies are failing, so local retention cannot release the disk they sit on and history stops reaching the tier. The object store, its credentials, or its bucket policy is the usual cause."
          runbook: docs/operations/runbooks/remote-copy-lag.md

      - alert: KrabkaRemoteCopyLagGrowing
        expr: deriv(krabka_broker_remote_copy_lag_segments[15m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is falling behind on remote copies for {{ $labels.topic }}"
          description: "The number of sealed local segments waiting to be copied has climbed for half an hour. The tier is producing more slowly than the topic is, and local disk fills at the difference. A copy that is failing outright fires KrabkaRemoteCopyErrors instead."
          runbook: docs/operations/runbooks/remote-copy-lag.md

      - alert: KrabkaRemoteFetchErrors
        expr: rate(krabka_broker_remote_fetch_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} cannot serve {{ $labels.topic }} from the remote tier"
          description: "A consumer reading history is being answered OFFSET_OUT_OF_RANGE because the tier will not serve the segment. Records already evicted locally are unreadable until this clears."
          runbook: docs/operations/runbooks/remote-copy-lag.md

      - alert: KrabkaWormSealFailures
        expr: rate(krabka_broker_worm_manifest_seal_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} cannot seal WORM manifests"
          description: "Segment copies into the write-once archive end without a usable manifest, so the segment stays in CopySegmentStarted and the archive stops attesting. Check the broker log for the partition and the backend error; krabka_broker_worm_manifests_sealed_total flat alongside this confirms the chain is not advancing."
          runbook: docs/operations/runbooks/worm-seal-failures.md

      - alert: KrabkaAuthenticationFailures
        expr: rate(krabka_broker_failed_authentication_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} rejects {{ $labels.mechanism }} authentications"
          description: "SaslAuthenticate frames keep coming back with an error. The metric comment names no threshold; one reject a second over five minutes is a starting point. A stale credential and a credential-stuffing burst look the same here -- krabka_broker_successful_authentication_total beside it tells them apart."
          runbook: docs/operations/runbooks/authentication-failures.md

      - alert: KrabkaAuthorizationDenials
        expr: rate(krabka_broker_authorization_denied_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} denies {{ $labels.operation }} on {{ $labels.resource_type }}"
          description: "The authorizer has answered Deny continuously for ten minutes. A single Deny is normal; a sustained rate is usually an ACL change that locked out a fleet. Kafka has no equivalent metric -- it only logs to kafka.authorizer.logger."
          runbook: docs/operations/runbooks/authorization-denials.md

      - alert: KrabkaAuditWriteFailures
        expr: rate(krabka_broker_audit_write_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} fails to write audit records"
          description: "Produces to __krabka_audit fail. Records divert to the spool until it fills."
          runbook: docs/operations/runbooks/audit-write-failures.md

      - alert: KrabkaAuditRecordsDropped
        expr: rate(krabka_broker_audit_records_dropped_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} drops audit records"
          description: "The audit channel or the spool is full. Every dropped record is a gap in the audit trail."
          runbook: docs/operations/runbooks/audit-write-failures.md

      - alert: KrabkaBarrierPartialCut
        expr: rate(krabka_broker_barrier_epochs_published_partial_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "barrier group {{ $labels.group }} published a partial cut"
          description: "An epoch's cut names a partition that got no marker. The group no longer reaches all of its partitions."
          runbook: docs/operations/runbooks/barrier-partial-cut.md

      - alert: KrabkaBreakGlassBypassed
        expr: rate(krabka_broker_break_glass_bypassed_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ran {{ $labels.action }} without an approved break-glass proposal"
          description: "A data-losing transition ran past the two-person rule. Read the audit log for the partition it names."
          runbook: docs/operations/runbooks/break-glass-bypassed.md

  - name: krabka-broker-diskless-wal
    rules:
      - alert: KrabkaDisklessWalQuorumLoss
        expr: rate(krabka_broker_diskless_wal_quorum_loss_events_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} could not form a diskless WAL quorum"
          description: "A leader-side append could not reach enough WAL voters. acks=all produces to diskless topics fail while this persists."
          runbook: docs/operations/runbooks/diskless-wal-quorum-loss.md

      - alert: KrabkaDisklessWalFlushFailures
        expr: rate(krabka_broker_diskless_wal_flush_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} fails to flush diskless WAL objects"
          description: "Object-store writes fail. The local hot tail grows until the flush succeeds."
          runbook: docs/operations/runbooks/diskless-wal-flush-failures.md

      - alert: KrabkaDisklessWalColdReadErrors
        expr: rate(krabka_broker_diskless_wal_cold_read_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} fails diskless WAL cold reads"
          description: "Reads of trimmed offsets fail in the object store. Consumers behind the trim frontier get errors."
          runbook: docs/operations/runbooks/diskless-wal-flush-failures.md

      - alert: KrabkaDisklessWalVoterLag
        expr: krabka_broker_diskless_wal_voter_lag > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "WAL voter {{ $labels.voter }} lags shard {{ $labels.topic_id }}/{{ $labels.partition }} by {{ $value }} offsets"
          description: "A voter's durable offset trails the leader log end. The metric comment names no threshold; 10000 offsets over ten minutes is a starting point."
          runbook: docs/operations/runbooks/diskless-wal-voter-lag.md

  - name: krabka-broker-features
    rules:
      - alert: KrabkaSchemaRegistryUnavailable
        expr: sum by (instance, topic) (rate(krabka_broker_schema_validation_rejections_total{reason="registry_unavailable"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} rejects produces to {{ $labels.topic }} because the schema registry is unreachable"
          description: "KFC-7 validation could not reach the registry and [schema_registry].fail_open is false, which is the default, so the produce is refused rather than accepted unvalidated. An external HTTP service is a hard dependency of the produce path here; without this rule the first signal is the producer's own errors."
          runbook: docs/operations/runbooks/schema-registry-unavailable.md

      - alert: KrabkaDeliveryActivationLate
        expr: histogram_quantile(0.99, sum by (le, instance) (rate(krabka_broker_delivery_activation_lateness_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} activates KFC-1 batches {{ $value }}s past their deadline at p99"
          description: "A healthy broker reports zero. The metric comment says a rising tail means the bound the broker publishes is not honest, or that the scheduler is starved of CPU. One second at p99 over ten minutes is a starting point; a cluster that sells a tighter delivery bound needs a smaller one."
          runbook: docs/operations/runbooks/delivery-activation-lateness.md

  - name: krabka-broker-local-storage
    rules:
      - alert: KrabkaLogCleanerFailures
        expr: sum by (instance, topic, reason) (rate(krabka_broker_log_cleaner_failures_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} fails to compact {{ $labels.topic }} ({{ $labels.reason }})"
          description: "A compaction pass failed. On a compacted topic the cleaner is also what bounds the log, so compaction and local retention stop together and the disk keeps filling with no other signal. A reason of io is a storage failure the broker has already reported to its log-dir registry."
          runbook: docs/operations/runbooks/log-cleaner-stalled.md

      - alert: KrabkaUncleanablePartitions
        expr: krabka_broker_log_cleaner_uncleanable_partitions > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} cannot clean {{ $value }} partitions"
          description: "Partitions whose most recent compaction attempt failed and which have not compacted since, the count Kafka's LogCleanerManager publishes as uncleanable-partitions-count. A partition that stays here through half an hour of sweeps is not going to recover on its own."
          runbook: docs/operations/runbooks/log-cleaner-stalled.md

      - alert: KrabkaOfflineLogDirs
        expr: krabka_broker_offline_log_dirs > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has {{ $value }} log directories offline"
          description: "A log directory failed the startup writability probe or a live write or fsync to it failed. Every partition on that dir answers KAFKA_STORAGE_ERROR until the broker restarts, and JBOD placement stops using it."
          runbook: docs/operations/runbooks/offline-log-dir.md
